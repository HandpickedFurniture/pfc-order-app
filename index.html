<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f4c5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PFC Sales Order</title>
<style>
  :root{
    --brand:#0f4c5c; --brand-dark:#0a3540; --accent:#e36414; --ok:#1a7f37;
    --bg:#f2f5f7; --card:#ffffff; --line:#dde4e8; --txt:#16232a; --muted:#5f7480;
    --danger:#c0392b; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;}
  h1,h2,h3{margin:0;}
  .hidden{display:none !important;}

  /* Header */
  header{background:var(--brand);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:10px;}
  header .logo{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--brand);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;}
  header .t1{font-size:17px;font-weight:700;line-height:1.1;}
  header .t2{font-size:12px;opacity:.85;}

  /* Steps */
  .steps{display:flex;gap:6px;padding:12px 16px 0;}
  .steps .dot{flex:1;height:6px;border-radius:3px;background:#cfd9de;}
  .steps .dot.on{background:var(--accent);}
  .stepname{padding:8px 16px 4px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}

  main{padding:0 14px 140px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  label.f:first-child{margin-top:0;}
  label.f .req{color:var(--danger);}
  input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{
    width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;
    background:#fff;color:var(--txt);appearance:none;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);}
  textarea{min-height:70px;resize:vertical;}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px;}

  .btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:18px;
    font-weight:700;cursor:pointer;text-align:center;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.brand{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
  .btn.small{padding:11px;font-size:15px;width:auto;display:inline-block;}
  .btn:disabled{opacity:.5;}
  .btnrow{display:flex;gap:10px;}
  .btnrow .btn{flex:1;}

  /* chips / segmented */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:11px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;
    font-size:15px;font-weight:600;color:var(--txt);cursor:pointer;}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;}
  .seg button{flex:1;padding:13px 6px;border:none;background:#fff;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg button.on{background:var(--brand);color:#fff;}

  /* style cards */
  .stylegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stylecard{border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;
    background:#fff;cursor:pointer;}
  .stylecard.on{border-color:var(--accent);background:#fdf1e8;}
  .stylecard .ic{font-size:26px;}
  .stylecard .nm{font-weight:700;font-size:14.5px;margin-top:4px;}
  .stylecard .pr{font-size:12px;color:var(--muted);margin-top:2px;}

  /* window list */
  .wincard{border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;
    padding:14px;margin:10px 0;}
  .wincard .top{display:flex;justify-content:space-between;align-items:center;}
  .wincard .nm{font-weight:800;font-size:17px;}
  .wincard .pill{background:#e8f0f3;color:var(--brand);font-size:12.5px;font-weight:700;
    border-radius:999px;padding:4px 10px;}
  .wincard .det{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .wincard .price{font-size:17px;font-weight:800;color:var(--brand);margin-top:8px;}
  .wincard .acts{display:flex;gap:8px;margin-top:10px;}
  .wincard .acts button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:14.5px;font-weight:600;cursor:pointer;}
  .wincard .acts .del{color:var(--danger);border-color:#eecfca;}

  /* addon rows */
  .addon{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:8px;}
  .addon:last-child{border-bottom:none;}
  .addon .l{flex:1;}
  .addon .nm{font-size:15px;font-weight:600;}
  .addon .pr{font-size:12.5px;color:var(--muted);}
  .switch{width:52px;height:32px;border-radius:16px;background:#cfd9de;position:relative;flex:none;cursor:pointer;border:none;}
  .switch.on{background:var(--ok);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
    background:#fff;transition:left .15s;}
  .switch.on::after{left:23px;}
  .stepper{display:flex;align-items:center;gap:2px;flex:none;}
  .stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:20px;font-weight:700;color:var(--brand);cursor:pointer;}
  .stepper .qv{width:34px;text-align:center;font-weight:700;font-size:16px;}

  /* totals bar */
  .totbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));z-index:60;box-shadow:0 -3px 12px rgba(0,0,0,.07);}
  .totbar .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);}
  .totbar .row.big{font-size:19px;font-weight:800;color:var(--txt);}
  .totbar .save{font-size:12.5px;color:var(--ok);font-weight:700;}
  .totbar .btn{margin-top:8px;}

  /* overlay */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;
    padding:0 14px 120px;}
  .overlay .obar{position:sticky;top:0;background:var(--bg);padding:14px 0 8px;z-index:5;
    display:flex;align-items:center;gap:10px;}
  .overlay .obar h2{font-size:18px;flex:1;}
  .overlay .obar .x{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);
    background:#fff;font-size:18px;cursor:pointer;}
  .obtns{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));z-index:110;}

  /* fabric picker */
  .fabbtn{width:100%;padding:14px;border:1.5px dashed var(--brand);border-radius:12px;background:#f4fafc;
    font-size:15.5px;font-weight:600;color:var(--brand);cursor:pointer;text-align:left;}
  .fabbtn.set{border-style:solid;background:#eef7ef;border-color:var(--ok);color:var(--txt);}
  .fablist{margin-top:8px;}
  .fabitem{padding:13px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;cursor:pointer;font-size:15.5px;}
  .fabitem .rw{color:var(--muted);font-size:13.5px;}
  .estbox{background:#eef4f6;border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--brand-dark);margin-top:8px;line-height:1.5;}

  /* review */
  .revline{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;}
  .revline.mut{color:var(--muted);font-size:14px;}
  .revline.tot{font-size:20px;font-weight:800;border-top:2px solid var(--line);padding-top:12px;margin-top:6px;}
  .disc{color:var(--ok);font-weight:700;}
  .nudge{background:#fdf6ec;border:1px solid #f0dcbd;color:#8a6d3b;border-radius:10px;
    padding:10px 12px;font-size:13.5px;margin-top:8px;}

  /* success */
  .success{ text-align:center;padding:60px 20px;}
  .success .big{font-size:64px;}
  .success .ono{font-size:40px;font-weight:900;color:var(--brand);margin:10px 0;}
  .success .amt{font-size:20px;font-weight:700;}
  .success .sub{color:var(--muted);margin:14px 0 30px;line-height:1.6;}

  .toast{position:fixed;top:14px;left:14px;right:14px;background:var(--danger);color:#fff;
    padding:14px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .toast.ok{background:var(--ok);}
  .loading{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:300;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;color:var(--brand);}
  .spin{width:44px;height:44px;border:5px solid #cfe0e6;border-top-color:var(--brand);border-radius:50%;
    animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .gpsbox{display:flex;gap:10px;align-items:center;}
  .gpsbox .st{flex:1;font-size:14px;color:var(--muted);}
  .gpsbox .st.ok{color:var(--ok);font-weight:700;}

  /* two numeric inputs side by side */
  .two{display:flex;gap:10px;}
  .two > div{flex:1;min-width:0;}
  .two label.f{margin-top:10px;}
  /* total-width / total-height callout */
  .totbox{background:#eef7ef;border:1.5px solid var(--ok);border-radius:10px;padding:11px 12px;
    margin-top:10px;font-size:15px;font-weight:700;color:var(--brand-dark);text-align:center;}
  .totbox small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px;}
  /* collapsible optional sections */
  .acc{border:1.5px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:#fff;}
  .acc > .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 14px;
    font-weight:700;font-size:15px;cursor:pointer;color:var(--brand-dark);}
  .acc > .hd .ar{color:var(--muted);font-size:13px;font-weight:600;}
  .acc > .bd{padding:0 14px 14px;border-top:1px solid var(--line);}
  .acc.shut > .bd{display:none;}
  /* photos */
  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photos .ph{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);}
  .photos .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .photos .ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer;}
  .cambtn{width:100%;padding:14px;border:1.5px dashed var(--brand);border-radius:12px;background:#f4f9fb;
    font-size:15.5px;font-weight:600;color:var(--brand);cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="logo">PFC</div>
  <div>
    <div class="t1">Perfect Fit Curtains</div>
    <div class="t2">Sales Order App</div>
  </div>
</header>

<div class="steps" id="stepdots">
  <div class="dot on"></div><div class="dot"></div><div class="dot"></div>
</div>
<div class="stepname" id="stepname">Step 1 of 3 — Customer</div>

<main id="main"></main>

<div class="totbar" id="totbar" style="display:none">
  <div class="row"><span id="tb_l1">Subtotal</span><span id="tb_v1">AED 0</span></div>
  <div class="row" id="tb_discrow" style="display:none"><span class="save" id="tb_l2"></span><span class="save" id="tb_v2"></span></div>
  <div class="row big"><span>Total</span><span id="tb_tot">AED 0</span></div>
  <button class="btn primary" id="tb_btn">Continue</button>
</div>

<div id="overlay_root"></div>
<div class="loading" id="loading"><div class="spin"></div><div id="loadmsg">Loading…</div></div>

<script>
"use strict";
/* ================= CONFIG ================= */
const SB_URL = "https://tdnxoezdbwlpmxgvtgdw.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbnhvZXpkYndscG14Z3Z0Z2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzc1MjIsImV4cCI6MjEwMDk1MzUyMn0.8tIy33fg44Wy6-HUAnmSGQyvcLxwzu5H_o3IXte_WXs";
const DEFAULT_ROLL_CM = 280;         // used when fabric/roll width unknown
const SAFETY_M = 1;                  // always add 1 m of fabric
const FULLNESS = {wave:2.5, american:2.2, eyelet:2.2, ring:2.2, roman:1.0};
const STYLE_META = {
  american:{nm:"American Style", ic:"🪡", cat:"curtain"},
  wave:{nm:"Wave Style", ic:"🌊", cat:"curtain"},
  eyelet:{nm:"Eyelet", ic:"⭕", cat:"curtain"},
  roman:{nm:"Roman Blind", ic:"📜", cat:"curtain"},
  roller:{nm:"Roller Blind", ic:"🎞️", cat:"blind"},
  zebra:{nm:"Zebra Blind", ic:"🦓", cat:"blind"},
  vertical:{nm:"Vertical Blind", ic:"📶", cat:"blind"},
  venetian:{nm:"Venetian Blind", ic:"🪟", cat:"blind"},
  wooden:{nm:"Wooden Blind", ic:"🪵", cat:"blind"}
};
const LAYER_NAMES = {sheer:"Sheer only", blackout:"Blackout only", sheer_blackout:"Sheer + Blackout"};
const ROOMS = ["Living Room","Master Bedroom","Bedroom 2","Bedroom 3","Kids Room","Majlis","Dining","Kitchen","Office","Balcony Door","Other"];
const PHOTO_BUCKET = "window-photos";
const PHOTO_MAX_PX = 1280;           // downscale before upload — salespeople are on mobile data
const CEILING_MATERIALS = ["Gypsum","Concrete","Marble","Wood","Other"];
const WINDOW_SHAPES = ["Straight","Curved","L-shape","Bay"];
const SIDES = ["Left","Right","Both"];
const TIEBACK_FINISHES = ["Gold","Nickel","White"];
const EXISTING_TYPES = ["Curtains","Blinds","Track only"];

/* ================= STATE ================= */
let CATALOG = [];            // active product rows
let FABRICS = [];            // [{c: code, w: roll width}]
let SALESPEOPLE = [];
let state = {
  step: 1,
  customer_name:"", customer_phone:"", salesperson:"",
  gps:null, location_url:"", installation_date:"", address:"",
  floor_number:"", lift_available:null,
  advance_amount:"", payment_mode:"", notes:"",
  windows: []
};
let editWin = null;          // window being edited (copy)
let editIdx = -1;
let accOpen = {site:false, finish:false};   // optional sections stay collapsed by default

/* ================= HELPERS ================= */
const $ = s => document.querySelector(s);
const el = (h) => { const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstChild; };
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "AED " + Number(n||0).toLocaleString("en-AE",{minimumFractionDigits:2, maximumFractionDigits:2});
const fmt0 = n => "AED " + Number(n||0).toLocaleString("en-AE",{maximumFractionDigits:0});
const r2 = n => Math.round(n*100)/100;

function toast(msg, ok){ const t = el(`<div class="toast ${ok?"ok":""}">${esc(msg)}</div>`);
  document.body.appendChild(t); setTimeout(()=>t.remove(), 3500); }
function loading(on, msg){ $("#loading").style.display = on?"flex":"none"; if(msg) $("#loadmsg").textContent = msg; }

async function api(path, opts={}) {
  const r = await fetch(SB_URL + path, {...opts, headers:{
    "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json",
    ...(opts.headers||{}) }});
  if(!r.ok){ let m = "Request failed ("+r.status+")";
    try{ const j = await r.json(); m = j.message || j.hint || j.error || m; }catch(e){}
    throw new Error(m); }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}

/* ================= PHOTOS ================= */
// Shrink on-device before upload — a raw phone photo is ~4 MB and would stall the form on mobile data.
function downscaleImage(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const scale = Math.min(1, PHOTO_MAX_PX/Math.max(img.width, img.height));
      const cw = Math.max(1,Math.round(img.width*scale)), ch = Math.max(1,Math.round(img.height*scale));
      const c = document.createElement("canvas"); c.width=cw; c.height=ch;
      c.getContext("2d").drawImage(img,0,0,cw,ch);
      c.toBlob(b=> b ? resolve(b) : reject(new Error("could not process image")), "image/jpeg", 0.7);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("could not read image")); };
    img.src = url;
  });
}

async function uploadPhoto(file){
  const blob = await downscaleImage(file);
  const name = Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";
  const path = PHOTO_BUCKET+"/"+name;
  const r = await fetch(SB_URL+"/storage/v1/object/"+path, {
    method:"POST",
    headers:{"apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"image/jpeg"},
    body: blob });
  if(!r.ok){ let m="upload failed ("+r.status+")";
    try{ const j=await r.json(); m=j.message||j.error||m; }catch(e){}
    throw new Error(m); }
  return SB_URL+"/storage/v1/object/public/"+path;
}

/* ================= DATA LOAD ================= */
async function bootstrap(){
  loading(true, "Loading catalog…");
  try{
    const [cat, sp] = await Promise.all([
      api("/rest/v1/product_catalog?select=code,name,category,style,layer_type,unit,price,tall_window_rule,uses_fabric,sort_order&is_active=eq.true&order=sort_order"),
      api("/rest/v1/salespersons?select=name&order=name")
    ]);
    CATALOG = cat; SALESPEOPLE = sp.map(x=>x.name);
    // fabrics: cached 24h in localStorage
    let fc = null;
    try{ fc = JSON.parse(localStorage.getItem("pfc_fabrics_v1")||"null"); }catch(e){}
    if(fc && Date.now()-fc.t < 24*3600*1000 && Array.isArray(fc.d) && fc.d.length){ FABRICS = fc.d; }
    else{
      loading(true, "Loading fabric list…");
      const rows = [];
      for(let off=0;;off+=1000){                       // PostgREST caps at 1000 rows/request
        const page = await api("/rest/v1/fabrics?select=fabric_code,roll_width_cm&order=fabric_code",
          {headers:{"Range": off+"-"+(off+999)}});
        rows.push(...(page||[]));
        if(!page || page.length<1000) break;
      }
      FABRICS = rows.map(r=>({c:r.fabric_code, w:r.roll_width_cm?Number(r.roll_width_cm):null}));
      try{ localStorage.setItem("pfc_fabrics_v1", JSON.stringify({t:Date.now(), d:FABRICS})); }catch(e){}
    }
    // restore draft
    try{ const d = JSON.parse(localStorage.getItem("pfc_draft_v1")||"null");
      if(d && d.windows){ state = {...state, ...d, step: d.step||1};
        // drafts saved by an older build lack the coverage keys — migrate them in place
        state.windows = (state.windows||[]).map(w=>applyGeometry(normalizeWin(w))); } }catch(e){}
    const lastSp = localStorage.getItem("pfc_salesperson");
    if(lastSp && !state.salesperson) state.salesperson = lastSp;
  }catch(e){ toast("Could not load data: "+e.message); }
  loading(false);
  render();
}

function saveDraft(){ try{ localStorage.setItem("pfc_draft_v1", JSON.stringify(state)); }catch(e){} }

/* ================= PRODUCT LOOKUPS ================= */
function productFor(style, layer){
  const meta = STYLE_META[style]||{};
  if(meta.cat === "blind") return CATALOG.find(p=>p.category==="blind" && p.style===style);
  return CATALOG.find(p=>p.category==="curtain" && p.style===style && p.layer_type===layer);
}
function addonRow(code){ return CATALOG.find(p=>p.code===code); }
function availableStyles(){
  const seen = [], out=[];
  for(const p of CATALOG){ if(p.category==="addon") continue;
    if(!p.style || seen.includes(p.style)) continue; seen.push(p.style);
    out.push(p.style); }
  return out;
}
function layersForStyle(style){
  return CATALOG.filter(p=>p.category==="curtain" && p.style===style).map(p=>p.layer_type);
}

/* ================= CALCULATIONS ================= */
function rollWidthOf(code){ if(!code) return null;
  const f = FABRICS.find(x=>x.c===code); return f && f.w ? f.w : null; }

// Fabric needed for ONE layer of a window (metres). Mirrors production panel-plan logic:
// railroaded when roll width > fabric height + 22cm; else vertical panels of (height+22cm).
// +16cm sewing allowance on gathered width, +1m safety always added.
function fabricMeters(style, widthCm, heightCm, poolingCm, rollCm, fullnessOverride){
  if(!widthCm || !heightCm) return 0;
  const mult = (+fullnessOverride > 0) ? +fullnessOverride : (FULLNESS[style] ?? 2.2);
  const roll = rollCm || DEFAULT_ROLL_CM;
  const hFab = Math.max(heightCm + (poolingCm||0), 30);
  const gatheredW = widthCm * mult;
  let m;
  if(roll > hFab + 22){ m = (gatheredW + 16)/100; }
  else{ const panels = Math.ceil((gatheredW + 16)/roll); m = panels * (hFab + 22)/100; }
  return Math.ceil((m + SAFETY_M)*10)/10;   // round UP to 0.1 m
}

function windowFabrics(w){
  // returns [{layer:'sheer'|'blackout', code, roll, meters}]
  const p = productFor(w.style, w.layer); if(!p || !p.uses_fabric) return [];
  const out = [];
  const need = (w.style==="roman") ? [w.layer] :
    (w.layer==="sheer_blackout" ? ["sheer","blackout"] : [w.layer]);
  for(const lay of need){
    const code = lay==="sheer" ? w.fabric_sheer : w.fabric_blackout;
    const roll = rollWidthOf(code);
    out.push({layer:lay, code:code||null, roll:roll,
      meters: fabricMeters(w.style, +w.width_cm, +w.height_cm, +w.pooling_cm||0, roll, w.fullness_override)});
  }
  return out;
}

function priceProduct(p, widthCm, heightCm){
  const billW = Math.max(widthCm,100)/100;
  let rate = +p.price;
  if(p.tall_window_rule && heightCm > 300) rate = rate * (heightCm/100)/3;
  if(p.unit==="per_m_width") return r2(rate*billW);
  if(p.unit==="per_sqm") return r2(rate*billW*(heightCm/100));
  if(p.unit==="fixed") return r2(rate);
  return r2(rate);
}

function windowAddons(w){
  // returns [{code,name,qty,amount}]
  const out=[]; const width=+w.width_cm||0, height=+w.height_cm||0;
  const billW=Math.max(width,100)/100;
  const push=(code,qty)=>{ const p=addonRow(code); if(!p) return;
    let amt;
    if(p.unit==="per_m_width") amt = r2(+p.price*billW);
    else if(p.unit==="per_sqm") amt = r2(+p.price*billW*(height/100));
    else if(p.unit==="fixed") amt = r2(+p.price);
    else amt = r2(+p.price*qty);
    out.push({code, name:p.name, qty, amount:amt}); };
  const a = w.addons||{};
  if(a.pelmet) push("ADD-PELC",1);
  if(a.boxblind) push("ADD-BOXB",1);
  if(a.motor) push(w.layer==="sheer_blackout" ? "ADD-MOT2" : "ADD-MOT1", 1);
  if(a.stick>0) push("ADD-STK", a.stick);
  if(a.returns>0) push("ADD-RET", a.returns);
  if(a.bend>0) push("ADD-BND", a.bend);
  if(a.velcro) push("ADD-VEL",1);
  if(a.tie>0) push("ADD-TIE", a.tie);
  if(a.removal) push("ADD-REM",1);
  if(a.alteration>0) push("ADD-ALT", a.alteration);
  return out;
}

function windowPrice(w){
  const p = productFor(w.style, w.layer);
  if(!p || !w.width_cm || !w.height_cm) return {base:0, addons:0, total:0, list:[]};
  const base = priceProduct(p, +w.width_cm, +w.height_cm);
  const list = windowAddons(w);
  const addons = r2(list.reduce((s,x)=>s+x.amount,0));
  return {base, addons, total:r2(base+addons), list};
}

// Human-readable summary of how the total width was reached, so it can be checked at a glance.
function coverageNote(w){
  const bits = [];
  if(w.coverage==="window_width"){
    const lx=+w.left_extra_cm||0, rx=+w.right_extra_cm||0;
    bits.push(`Window width ${+w.base_width_cm||0}` + (lx||rx?` + ${lx} left + ${rx} right = <b>${w.width_cm} cm</b>`:` cm (no side extra)`));
  } else if(w.coverage==="inside_frame"){ bits.push("Inside frame"); }
  else { bits.push("Wall to wall"); }
  if(w.fixing==="Wall" && +w.top_extra_cm>0) bits.push(`+${+w.top_extra_cm} cm above window`);
  if(w.uneven){
    const hs=[w.height_left_cm,w.height_middle_cm,w.height_right_cm].map(x=>+x).filter(x=>x>0);
    if(hs.length>1) bits.push(`uneven ${hs.join("/")} → ${Math.min(...hs)}`);
  }
  if(w.measured_by==="customer") bits.push("⚠️ customer's sizes");
  if(+w.fullness_override>0) bits.push(`gather ${+w.fullness_override}×`);
  return bits.join(" · ");
}

function orderTotals(){
  let sub = 0;
  for(const w of state.windows) sub += windowPrice(w).total;
  sub = r2(sub);
  let pct = 0; if(sub>3000) pct=10; else if(sub>1500) pct=5;
  const disc = r2(sub*pct/100);
  return {sub, pct, disc, total:r2(sub-disc)};
}

function fabricSummary(){
  const agg = {};
  for(const w of state.windows){ for(const f of windowFabrics(w)){
    const key = f.code || "— fabric to be selected —";
    if(!agg[key]) agg[key] = 0; agg[key] = Math.round((agg[key]+f.meters)*10)/10; } }
  return Object.entries(agg).map(([code, m])=>({code, meters:m}));
}

/* ================= RENDER: STEPS ================= */
function render(){
  const dots = $("#stepdots").children;
  for(let i=0;i<3;i++) dots[i].classList.toggle("on", i < state.step);
  $("#stepname").textContent = state.step===1 ? "Step 1 of 3 — Customer"
    : state.step===2 ? "Step 2 of 3 — Windows & Products" : "Step 3 of 3 — Review & Confirm";
  if(state.step===1) renderStep1();
  if(state.step===2) renderStep2();
  if(state.step===3) renderStep3();
  saveDraft();
}

function totbar(show, btnLabel, handler){
  const tb = $("#totbar");
  if(!show){ tb.style.display="none"; return; }
  const t = orderTotals();
  tb.style.display="block";
  $("#tb_v1").textContent = fmt(t.sub);
  const dr = $("#tb_discrow");
  if(t.pct>0){ dr.style.display="flex"; $("#tb_l2").textContent = "Discount "+t.pct+"% applied 🎉";
    $("#tb_v2").textContent = "− "+fmt(t.disc); } else dr.style.display="none";
  $("#tb_tot").textContent = fmt(t.total);
  const b = $("#tb_btn"); b.textContent = btnLabel; b.onclick = handler;
}

/* ---------- window editor overlay ---------- */
function blankWin(){
  return { window_name:"W"+(state.windows.length+1), room:"", style:"", layer:"",
    width_cm:"", height_cm:"", pooling_cm:0, fixing:"", opening:"", track_color:"",
    fabric_sheer:"", fabric_blackout:"", addons:{stick:0,returns:0,bend:0,tie:0,alteration:0}, notes:"",
    // coverage geometry — width_cm/height_cm are always the DERIVED totals
    coverage:"wall_to_wall", base_width_cm:"", left_extra_cm:0, right_extra_cm:0,
    base_height_cm:"", top_extra_cm:0,
    uneven:false, height_left_cm:"", height_middle_cm:"", height_right_cm:"",
    measured_by:"", centre_overlap_cm:0, photos:[],
    // site details (optional)
    ceiling_material:"", skirting_height_cm:"", pocket_depth_cm:"", window_shape:"",
    // finishing details (optional)
    velcro_side:"", velcro_middle_pieces:0, tieback_finish:"", tieback_side:"",
    motor_side:"", socket_nearby:null, trunking_needed:null,
    existing_covering:"", existing_count:0, existing_action:"", fullness_override:"" };
}

// Fill in keys missing from older drafts / older saved windows, so arithmetic never sees undefined.
function normalizeWin(w){
  const d = blankWin();
  for(const k in d){ if(w[k]===undefined) w[k] = d[k]; }
  w.addons = w.addons || {};
  if(!Array.isArray(w.photos)) w.photos = [];
  // pre-coverage windows stored only width_cm/height_cm — treat those as the base measurement
  if(w.base_width_cm==="" && w.width_cm!=="") w.base_width_cm = w.width_cm;
  if(w.base_height_cm==="" && w.height_cm!=="") w.base_height_cm = w.height_cm;
  return w;
}

// Single source of truth for the derived totals. Call before pricing or rendering.
function applyGeometry(w){
  const lx = w.coverage==="window_width" ? (+w.left_extra_cm||0) : 0;
  const rx = w.coverage==="window_width" ? (+w.right_extra_cm||0) : 0;
  const tx = w.fixing==="Wall" ? (+w.top_extra_cm||0) : 0;
  w.width_cm  = w.base_width_cm==="" || w.base_width_cm==null ? "" : r2((+w.base_width_cm||0) + lx + rx);
  w.height_cm = w.base_height_cm==="" || w.base_height_cm==null ? "" : r2((+w.base_height_cm||0) + tx);
  return w;
}

function openWinEditor(idx){
  editIdx = idx;
  editWin = idx>=0 ? JSON.parse(JSON.stringify(state.windows[idx])) : blankWin();
  normalizeWin(editWin); applyGeometry(editWin);
  accOpen = {site:false, finish:false};
  drawWinEditor();
}

function drawWinEditor(){
  const w = editWin;
  const styles = availableStyles();
  const meta = STYLE_META[w.style]||{};
  const isBlind = meta.cat==="blind";
  const isCurtain = meta.cat==="curtain" && w.style!=="roman";
  const p = w.style && w.layer ? productFor(w.style,w.layer) : (isBlind? productFor(w.style,null):null);

  // "Inside frame" only makes sense for things that sit in a recess
  const canInside = isBlind || w.style==="roman";
  if(w.coverage==="inside_frame" && !canInside) w.coverage = "wall_to_wall";
  // uneven heights drive the base height: use the SMALLEST so the curtain never drags
  if(w.uneven){
    const hs = [w.height_left_cm, w.height_middle_cm, w.height_right_cm].map(x=>+x).filter(x=>x>0);
    if(hs.length) w.base_height_cm = Math.min(...hs);
  }
  applyGeometry(w);

  const covLabel = w.coverage==="window_width" ? "Window width (cm)"
    : w.coverage==="inside_frame" ? "Recess width (cm)" : "Wall-to-wall width (cm)";
  const covHint = w.coverage==="window_width" ? "Just the window opening itself — the side extras go below."
    : w.coverage==="inside_frame" ? "Measure inside the recess at its narrowest point."
    : "The full wall span to be covered. Minimum 1 m is charged.";
  let unevenNote = "";
  if(w.uneven){
    const hs = [w.height_left_cm, w.height_middle_cm, w.height_right_cm].map(x=>+x).filter(x=>x>0);

      ? `<div class="totbox">📐 Height used: ${Math.min(...hs)} cm<small>Smallest of the three — difference ${r2(Math.max(...hs)-Math.min(...hs))} cm is recorded for the installer</small></div>`
      : `<div class="hint">Enter all three heights. The smallest will be used so the curtain never drags.</div>`;
  }

  const fabs = windowFabrics(w);

      <div class="chips" id="w_rooms">${ROOMS.map(r=>`<div class="chip ${w.room===r?"on":""}" data-r="${esc(r)}">${esc(r)}</div>`).join("")}</div>

          <input type="number" id="w_rx" inputmode="decimal" placeholder="0" value="${+w.right_extra_cm||""}"></div>
      </div>
      <div class="hint">How much the curtain goes past the window on each side. Leave 0 if none.</div>
      ${w.base_width_cm!==""?`<div class="totbox">📏 Total width to cover: ${w.width_cm} cm
        <small>${+w.base_width_cm} window + ${+w.left_extra_cm||0} left + ${+w.right_extra_cm||0} right</small></div>`:""}`:""}

      <label class="f">Fixing</label>
      <div class="seg" id="w_fix">
        <button data-f="Wall" class="${w.fixing==="Wall"?"on":""}">Wall</button>
        <button data-f="Ceiling" class="${w.fixing==="Ceiling"?"on":""}">Ceiling</button>
      </div>

      <div class="addon" style="margin-top:10px">
        <div class="l"><div class="nm">Floor or ceiling is uneven</div>
          <div class="pr">Record left / middle / right heights</div></div>
        <button class="switch ${w.uneven?"on":""}" data-uv="1"></button>
      </div>

      ${w.uneven?`
      <div class="two">
        <div><label class="f">Left (cm)</label><input type="number" id="w_hl" inputmode="decimal" value="${w.height_left_cm||""}"></div>
        <div><label class="f">Middle (cm)</label><input type="number" id="w_hm" inputmode="decimal" value="${w.height_middle_cm||""}"></div>
        <div><label class="f">Right (cm)</label><input type="number" id="w_hr" inputmode="decimal" value="${w.height_right_cm||""}"></div>
      </div>
      ${unevenNote}`:`
      <label class="f">Height (cm) <span class="req">*</span></label>
      <input type="number" id="w_bh" inputmode="decimal" placeholder="e.g. 290" value="${w.base_height_cm||""}">`}

      ${w.fixing==="Wall"?`
      <label class="f">Extra above the window (cm)</label>
      <input type="number" id="w_tx" inputmode="decimal" placeholder="0" value="${+w.top_extra_cm||""}">
      <div class="hint">How high above the window the track sits. Leave 0 if the height above already includes it.</div>
      ${w.base_height_cm!==""&&+w.top_extra_cm>0?`<div class="totbox">📐 Total height: ${w.height_cm} cm
        <small>${+w.base_height_cm} + ${+w.top_extra_cm} above window</small></div>`:""}`:""}

      ${(p && p.tall_window_rule) ? `<div class="hint">Above 300 cm height, the rate increases proportionally (× height ÷ 3).</div>`:""}
      ${!isBlind && w.style ? `
      <label class="f">Pooling on floor</label>
      <div class="seg" id="w_pool">
        <button data-p="-1" class="${+w.pooling_cm<0?"on":""}">Above floor</button>
        <button data-p="0" class="${+w.pooling_cm===0?"on":""}">Touching</button>
        <button data-p="1" class="${+w.pooling_cm>0?"on":""}">Puddle</button>
      </div>
      <div id="w_poolcm_wrap" class="${+w.pooling_cm===0?"hidden":""}" style="margin-top:8px">
        <input type="number" id="w_poolcm" inputmode="decimal" placeholder="cm" value="${Math.abs(+w.pooling_cm)||""}">
        <div class="hint">${+w.pooling_cm<0?"How many cm above the floor":"How many cm pooling on the floor"}</div>
      </div>`:""}

      <label class="f">Who measured?</label>
      <div class="seg" id="w_meas">
        <button data-m="our_team" class="${w.measured_by==="our_team"?"on":""}">Our team</button>
        <button data-m="customer" class="${w.measured_by==="customer"?"on":""}">Customer gave sizes</button>
      </div>
      ${w.measured_by==="customer"?`<div class="hint">⚠️ Our team will re-measure before production. The final invoice follows our measurement.</div>`:""}
    </div>

    <div class="card">
      ${isCurtain||w.style==="roman"?`
      <label class="f">Opening</label>
      <div class="seg" id="w_open">
        <button data-o="Middle (2-way)" class="${w.opening==="Middle (2-way)"?"on":""}">Middle</button>
        <button data-o="One side (1-way)" class="${w.opening==="One side (1-way)"?"on":""}">One side</button>
      </div>
      ${w.opening==="Middle (2-way)"?`
      <label class="f">Centre overlap (cm)</label>
      <input type="number" id="w_ov" inputmode="decimal" placeholder="0" value="${+w.centre_overlap_cm||""}">
      <div class="hint">How much the two panels overlap in the middle.</div>`:""}`:""}
      ${isCurtain?`
      <label class="f">Track colour</label>
      <div class="chips" id="w_track">${["White","Black","Grey"].map(c=>`<div class="chip ${w.track_color===c?"on":""}" data-t="${c}">${c}</div>`).join("")}</div>`:""}
    </div>

    <div class="card">
      <label class="f">Photos of this window</label>
      <div class="photos" id="w_photos">${(w.photos||[]).map((u,pi)=>
        `<div class="ph"><img src="${esc(u)}" alt=""><button data-rmph="${pi}">✕</button></div>`).join("")}</div>
      <input type="file" id="w_file" accept="image/*" capture="environment" multiple style="display:none">
      <button class="cambtn" id="w_cam" style="margin-top:8px">📷 Take / add photo</button>
      <div class="hint">A photo saves a lot of explaining later — beams, sockets, skirting, existing tracks.</div>
    </div>

    ${fabSection}

    <div class="card">
      <label class="f">Add-ons for this window</label>
      ${addonToggle("pelmet","ADD-PELC", meta.cat==="curtain")}
      ${addonToggle("boxblind","ADD-BOXB", isBlind)}
      ${w.style?`<div class="addon"><div class="l"><div class="nm">${esc((addonRow(motorCode)||{}).name||"Motor + Remote")}</div>
        <div class="pr">${fmt0((addonRow(motorCode)||{}).price||0)} — 7 yr warranty</div></div>
        <button class="switch ${A.motor?"on":""}" data-tg="motor"></button></div>`:""}
      ${addonStep("stick","ADD-STK","per stick")}
      ${addonStep("returns","ADD-RET","per side")}
      ${addonStep("bend","ADD-BND","per meter")}
      ${addonToggle("velcro","ADD-VEL")}
      ${addonStep("tie","ADD-TIE","per curtain")}
      ${addonToggle("removal","ADD-REM")}
      ${addonStep("alteration","ADD-ALT","per curtain")}
    </div>

    <div class="acc ${accOpen.site?"":"shut"}" id="acc_site">
      <div class="hd" data-acc="site"><span>🏠 Site details (optional)</span>
        <span class="ar">${siteCount?siteCount+" set":"none"} ${accOpen.site?"▲":"▼"}</span></div>
      <div class="bd">
        <label class="f">Ceiling / wall material</label>
        ${chipRow("ceiling_material", CEILING_MATERIALS)}
        <div class="hint">Tells the team which drill and brackets to bring.</div>
        <div class="two">
          <div><label class="f">Skirting height (cm)</label>
            <input type="number" id="w_skirt" inputmode="decimal" placeholder="0" value="${w.skirting_height_cm||""}"></div>
          <div><label class="f">Pocket depth (cm)</label>
            <input type="number" id="w_pocket" inputmode="decimal" placeholder="0" value="${w.pocket_depth_cm||""}"></div>
        </div>
        <label class="f">Window shape</label>
        ${chipRow("window_shape", WINDOW_SHAPES)}
        ${w.window_shape&&w.window_shape!=="Straight"?`<div class="hint">⚠️ A bend rail is usually needed — add it under Add-ons.</div>`:""}
      </div>
    </div>

    <div class="acc ${accOpen.finish?"":"shut"}" id="acc_finish">
      <div class="hd" data-acc="finish"><span>🧷 Finishing details (optional)</span>
        <span class="ar">${finCount?finCount+" set":"none"} ${accOpen.finish?"▲":"▼"}</span></div>
      <div class="bd">
        ${w.addons&&w.addons.velcro?`
        <label class="f">Velcro side</label>
        ${chipRow("velcro_side", SIDES)}
        <div class="addon" style="margin-top:6px">
          <div class="l"><div class="nm">Extra pieces in the middle</div><div class="pr">Small velcro pieces</div></div>
          <div class="stepper"><button data-dec="velcro_middle_pieces">−</button>
          <div class="qv">${+w.velcro_middle_pieces||0}</div><button data-inc="velcro_middle_pieces">＋</button></div>
        </div>`:`<div class="hint">Turn on “Light-reduction Velcro Stitching” in Add-ons to set velcro placement.</div>`}

        ${w.addons&&w.addons.tie?`
        <label class="f">Tie-back finish</label>
        ${chipRow("tieback_finish", TIEBACK_FINISHES)}
        <label class="f">Tie-back side</label>
        ${chipRow("tieback_side", SIDES)}`:""}

        ${w.addons&&w.addons.motor?`
        <label class="f">Motor side</label>
        ${chipRow("motor_side", ["Left","Right"])}
        <div class="addon" style="margin-top:6px">
          <div class="l"><div class="nm">Power socket nearby</div><div class="pr">Within cable reach of the track</div></div>
          <button class="switch ${w.socket_nearby?"on":""}" data-bool="socket_nearby"></button>
        </div>
        <div class="addon">
          <div class="l"><div class="nm">Cable trunking needed</div><div class="pr">To hide the motor cable</div></div>
          <button class="switch ${w.trunking_needed?"on":""}" data-bool="trunking_needed"></button>
        </div>`:""}

        <label class="f">Already installed at this window</label>
        ${chipRow("existing_covering", EXISTING_TYPES)}
        ${w.existing_covering?`
        <div class="addon" style="margin-top:6px">
          <div class="l"><div class="nm">How many</div><div class="pr">Curtains / blinds to handle</div></div>
          <div class="stepper"><button data-dec="existing_count">−</button>
          <div class="qv">${+w.existing_count||0}</div><button data-inc="existing_count">＋</button></div>
        </div>
        <label class="f">What to do with it</label>
        <div class="seg" id="w_exact">
          <button data-set="existing_action|remove" class="${w.existing_action==="remove"?"on":""}">Remove</button>
          <button data-set="existing_action|reuse" class="${w.existing_action==="reuse"?"on":""}">Reuse</button>
          <button data-set="existing_action|leave" class="${w.existing_action==="leave"?"on":""}">Leave as is</button>
        </div>`:""}

        ${!isBlind&&w.style?`
        <label class="f">Gather / fullness override</label>
        <input type="number" id="w_full" inputmode="decimal" step="0.1"
          placeholder="Standard ${FULLNESS[w.style] ?? 2.2}× — leave empty" value="${w.fullness_override||""}">
        <div class="hint">Only if the customer asked for more or less gathering. This changes the fabric estimate.</div>`:""}
      </div>
    </div>

    <div class="card">
      <label class="f">Notes for this window (optional)</label>
      <textarea id="w_notes" placeholder="Anything special…">${esc(w.notes||"")}</textarea>
    </div>
    <div style="height:70px"></div>
  </div>
  <div class="obtns" id="ov_btns">
    <div class="row" style="display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin-bottom:8px">
      <span>This window</span><span>${fmt(price.total)}</span></div>
    <button class="btn primary" id="ov_save">Save Window</button>
  </div>`;

  $("#overlay_root").innerHTML = html;
  document.body.style.overflow = "hidden";

  // Every input in this overlay MUST be read here — the editor re-renders on any tap,
  // so an unread field would be wiped the moment the user touches a chip or switch.
  const val = (id, field)=>{ const e = $("#"+id); if(e) w[field] = e.value; };
  const grab = ()=>{
    w.window_name = $("#w_name").value.trim() || w.window_name;
    val("w_bw","base_width_cm"); val("w_lx","left_extra_cm"); val("w_rx","right_extra_cm");
    val("w_bh","base_height_cm"); val("w_tx","top_extra_cm");
    val("w_hl","height_left_cm"); val("w_hm","height_middle_cm"); val("w_hr","height_right_cm");
    val("w_ov","centre_overlap_cm");
    val("w_skirt","skirting_height_cm"); val("w_pocket","pocket_depth_cm");
    val("w_full","fullness_override");
    const pc = $("#w_poolcm"); if(pc){
      const sign = +w.pooling_cm<0 ? -1 : (+w.pooling_cm>0 ? 1 : 0);
      const v = Math.abs(+pc.value||0); w.pooling_cm = sign*v; }
    w.notes = $("#w_notes").value;
    if(w.uneven){
      const hs = [w.height_left_cm, w.height_middle_cm, w.height_right_cm].map(x=>+x).filter(x=>x>0);
      if(hs.length) w.base_height_cm = Math.min(...hs);
    }
    applyGeometry(w);
  };
  const redraw = ()=>{ grab(); drawWinEditor(); };

  $("#ov_x").onclick = ()=>{ closeOverlay(); };
  $("#winov").querySelectorAll("#w_rooms .chip").forEach(c=>c.onclick=()=>{ grab(); w.room = c.dataset.r; drawWinEditor(); });
  $("#winov").querySelectorAll("#w_styles .stylecard").forEach(c=>c.onclick=()=>{
    grab(); w.style = c.dataset.s;
    const lo = layersForStyle(w.style);
    if(STYLE_META[w.style]?.cat==="blind"){ w.layer = null; }
    else if(!lo.includes(w.layer)) w.layer = lo[0]||"";
    drawWinEditor(); });
  const wl = $("#w_layers"); if(wl) wl.querySelectorAll("button").forEach(b=>b.onclick=()=>{ grab(); w.layer=b.dataset.l; drawWinEditor(); });
  const wp = $("#w_pool"); if(wp) wp.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    grab(); const t=+b.dataset.p;
    w.pooling_cm = t===0?0:(t<0? -(Math.abs(+w.pooling_cm)||5) : (Math.abs(+w.pooling_cm)||5));
    drawWinEditor(); });
  const wf = $("#w_fix"); wf.querySelectorAll("button").forEach(b=>b.onclick=()=>{ grab(); w.fixing=b.dataset.f; drawWinEditor(); });
  const wo = $("#w_open"); if(wo) wo.querySelectorAll("button").forEach(b=>b.onclick=()=>{ grab(); w.opening=b.dataset.o; drawWinEditor(); });
  const wt = $("#w_track"); if(wt) wt.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ grab(); w.track_color=c.dataset.t; drawWinEditor(); });
  $("#winov").querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{ grab();
    const k=b.dataset.tg; w.addons[k]=!w.addons[k]; drawWinEditor(); });
  $("#winov").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{ grab();
    const k=b.dataset.sp; w.addons[k]=(+w.addons[k]||0)+1; drawWinEditor(); });
  $("#winov").querySelectorAll("[data-sm]").forEach(b=>b.onclick=()=>{ grab();
    const k=b.dataset.sm; w.addons[k]=Math.max(0,(+w.addons[k]||0)-1); drawWinEditor(); });
  $("#winov").querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>{ grab(); openFabricPicker(b.dataset.fp); });

  const wc = $("#w_cov"); if(wc) wc.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    grab();
    w.coverage = b.dataset.c;
    if(w.coverage!=="window_width"){ w.left_extra_cm = 0; w.right_extra_cm = 0; }
    drawWinEditor(); });
  const wm = $("#w_meas"); if(wm) wm.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    grab(); w.measured_by = w.measured_by===b.dataset.m ? "" : b.dataset.m; drawWinEditor(); });
  $("#winov").querySelectorAll("[data-uv]").forEach(b=>b.onclick=()=>{
    grab(); w.uneven = !w.uneven;
    if(!w.uneven){ w.height_left_cm=""; w.height_middle_cm=""; w.height_right_cm=""; }
    drawWinEditor(); });
  // generic chip / segment selection: data-set="field|value" (tap again to clear)
  $("#winov").querySelectorAll("[data-set]").forEach(c=>c.onclick=()=>{
    grab(); const i = c.dataset.set.indexOf("|");
    const f = c.dataset.set.slice(0,i), v = c.dataset.set.slice(i+1);
    w[f] = (w[f]===v ? "" : v);
    if(f==="existing_covering" && !w[f]){ w.existing_count = 0; w.existing_action = ""; }
    drawWinEditor(); });
  $("#winov").querySelectorAll("[data-bool]").forEach(b=>b.onclick=()=>{
    grab(); const f=b.dataset.bool; w[f] = !w[f]; drawWinEditor(); });
  $("#winov").querySelectorAll("[data-inc]").forEach(b=>b.onclick=()=>{
    grab(); const f=b.dataset.inc; w[f] = (+w[f]||0)+1; drawWinEditor(); });
  $("#winov").querySelectorAll("[data-dec]").forEach(b=>b.onclick=()=>{
    grab(); const f=b.dataset.dec; w[f] = Math.max(0,(+w[f]||0)-1); drawWinEditor(); });
  $("#winov").querySelectorAll("[data-acc]").forEach(h=>h.onclick=()=>{
    grab(); accOpen[h.dataset.acc] = !accOpen[h.dataset.acc]; drawWinEditor(); });

  // photos
  const fileEl = $("#w_file");
  $("#w_cam").onclick = ()=>{ grab(); fileEl.click(); };
  fileEl.onchange = async ()=>{
    const files = Array.from(fileEl.files||[]); if(!files.length) return;
    grab(); loading(true, "Uploading photo…");
    for(const f of files){
      try{ const url = await uploadPhoto(f); w.photos.push(url); }
      catch(e){ toast("Photo failed: "+e.message); }
    }
    loading(false); drawWinEditor();
  };
  $("#winov").querySelectorAll("[data-rmph]").forEach(b=>b.onclick=()=>{
    grab(); w.photos.splice(+b.dataset.rmph,1); drawWinEditor(); });

  // live recalc as numbers are typed — only bind ids that exist in this render
  ["w_bw","w_lx","w_rx","w_bh","w_tx","w_hl","w_hm","w_hr","w_full"].forEach(id=>{
    const e = $("#"+id); if(e) e.addEventListener("change", redraw); });

  $("#ov_save").onclick = ()=>{
    grab();
    if(!w.style){ toast("Please choose the product / style"); return; }
    if(STYLE_META[w.style]?.cat!=="blind" && !w.layer){ toast("Please choose the layers"); return; }
    if(!(+w.width_cm>0) || !(+w.height_cm>0)){ toast("Please enter width and height in cm"); return; }
    if(editIdx>=0) state.windows[editIdx]=w; else state.windows.push(w);
    closeOverlay(); render(); window.scrollTo(0,0);
  };
}

function closeOverlay(){ $("#overlay_root").innerHTML=""; document.body.style.overflow=""; }

/* ---------- fabric picker ---------- */
function openFabricPicker(layer){
  const html = `
  <div class="overlay" id="fabov" style="z-index:150">
    <div class="obar">
      <button class="x" id="fab_x">←</button>
      <h2>Choose ${layer} fabric</h2>
    </div>
    <input type="text" id="fab_q" placeholder="🔍 Type fabric code…" autocomplete="off" style="font-size:18px">
    <button class="btn ghost" style="margin-top:10px" id="fab_skip">Decide later (assume ${DEFAULT_ROLL_CM} cm roll)</button>
    <div class="fablist card" id="fab_list" style="padding:4px 12px"></div>
  </div>`;
  const root = document.createElement("div"); root.id="fab_root"; root.innerHTML = html;
  document.body.appendChild(root);

  const listEl = root.querySelector("#fab_list");
  const draw = q =>{
    q = (q||"").toLowerCase().trim();
    const hits = (q ? FABRICS.filter(f=>f.c.toLowerCase().includes(q)) : FABRICS).slice(0,60);
    listEl.innerHTML = hits.length ? hits.map(f=>
      `<div class="fabitem" data-c="${esc(f.c)}"><span>${esc(f.c)}</span>
       <span class="rw">${f.w?f.w+" cm":"width ?"}</span></div>`).join("")
      : `<div style="padding:20px;color:var(--muted)">No fabric found. Check the code spelling.</div>`;
    listEl.querySelectorAll(".fabitem").forEach(it=>it.onclick=()=>{
      if(layer==="sheer") editWin.fabric_sheer = it.dataset.c; else editWin.fabric_blackout = it.dataset.c;
      root.remove(); drawWinEditor(); });
  };
  draw("");
  root.querySelector("#fab_q").addEventListener("input", e=>draw(e.target.value));
  root.querySelector("#fab_q").focus();
  root.querySelector("#fab_x").onclick = ()=>{ root.remove(); drawWinEditor(); };
  root.querySelector("#fab_skip").onclick = ()=>{
    if(layer==="sheer") editWin.fabric_sheer=""; else editWin.fabric_blackout="";
    root.remove(); drawWinEditor(); };
}

/* ---------- STEP 3: review ---------- */
function renderStep3(){
  const m = $("#main");
  const t = orderTotals();
  const fs = fabricSummary();
  let winHtml = state.windows.map((w,i)=>{
    const p = windowPrice(w);
    const meta = STYLE_META[w.style]||{nm:w.style};
    return `<div class="revline"><span>${esc(w.window_name||("W"+(i+1)))} — ${esc(meta.nm)} ${esc(LAYER_NAMES[w.layer]||"")} (${w.width_cm}×${w.height_cm})</span>
      <span><b>${fmt(p.total)}</b></span></div>` +
      (coverageNote(w)?`<div class="revline mut"><span>&nbsp;&nbsp;${coverageNote(w)}</span><span></span></div>`:"") +
      p.list.map(a=>`<div class="revline mut"><span>&nbsp;&nbsp;• ${esc(a.name)}${a.qty>1?" ×"+a.qty:""}</span><span>${fmt(a.amount)}</span></div>`).join("");
  }).join("");

  let nudge = "";
  if(t.pct===0 && t.sub>0 && t.sub<=1500) nudge = `<div class="nudge">💡 Add ${fmt(1500.01-t.sub)} more to unlock a <b>5% discount</b>.</div>`;

  m.innerHTML = `
  <div class="card">
    <h3 style="margin-bottom:8px">👤 ${esc(state.customer_name)}</h3>
    <div class="revline mut"><span>Phone</span><span>${esc(state.customer_phone||"—")}</span></div>
    <div class="revline mut"><span>Salesperson</span><span>${esc(state.salesperson)}</span></div>
    <div class="revline mut"><span>Order date</span><span>${new Date().toLocaleDateString("en-AE",{day:"2-digit",month:"short",year:"numeric"})} (auto)</span></div>
    <div class="revline mut"><span>Installation</span><span>${esc(state.installation_date||"—")}</span></div>
    <div class="revline mut"><span>Location</span><span>${state.gps?"✓ GPS saved":"—"}</span></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px">🪟 Windows (${state.windows.length})</h3>
    ${winHtml}
    <div class="revline" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>
    ${t.pct?`<div class="revline disc"><span>Discount ${t.pct}% (auto)</span><span>− ${fmt(t.disc)}</span></div>`:""}
    <div class="revline tot"><span>Total</span><span>${fmt(t.total)}</span></div>
    ${nudge}
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px">🧵 Fabric required (incl. 1 m safety each)</h3>
    ${fs.length? fs.map(f=>`<div class="revline"><span>${esc(f.code)}</span><span><b>${f.meters} m</b></span></div>`).join("") : `<div class="revline mut"><span>No fabric products in this order</span><span></span></div>`}
  </div>

  <div class="card">
    <label class="f">Advance received (AED, optional)</label>
    <input type="number" id="f_adv" inputmode="decimal" placeholder="0" value="${esc(state.advance_amount)}">
    <label class="f">Payment mode</label>
    <div class="chips" id="f_pay">${["Cash","Card","Bank Transfer","Cheque"].map(pm=>`<div class="chip ${state.payment_mode===pm?"on":""}" data-p="${pm}">${pm}</div>`).join("")}</div>
    <label class="f">Order notes (optional)</label>
    <textarea id="f_notes" placeholder="Anything the production team should know…">${esc(state.notes)}</textarea>
  </div>
  <button class="btn ghost" id="s3back">← Back to Windows</button>`;

  $("#f_pay").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    state.payment_mode = state.payment_mode===c.dataset.p ? "" : c.dataset.p; renderStep3(); });
  $("#s3back").onclick = ()=>{ state.step=2; render(); };

  totbar(true, "✅ Confirm & Submit Order", submitOrder);
}

/* ---------- submit ---------- */
async function submitOrder(){
  state.advance_amount = $("#f_adv") ? $("#f_adv").value : state.advance_amount;
  state.notes = $("#f_notes") ? $("#f_notes").value : state.notes;
  const t = orderTotals();
  if(!confirm("Submit this order for "+esc(state.customer_name)+" — total "+fmt(t.total)+"?")) return;
  loading(true, "Submitting order…");
  const payload = {
    customer_name: state.customer_name,
    customer_phone: state.customer_phone,
    salesperson: state.salesperson,
    gps_lat: state.gps? state.gps.lat : null,
    gps_lng: state.gps? state.gps.lng : null,
    gps_accuracy_m: state.gps? state.gps.acc : null,
    location_url: state.location_url || null,
    installation_date: state.installation_date || null,
    address: state.address || null,
    floor_number: state.floor_number || null,
    lift_available: state.lift_available===null||state.lift_available===undefined?null:!!state.lift_available,
    advance_amount: state.advance_amount || 0,
    payment_mode: state.payment_mode || null,
    notes: state.notes || null,
    fabric_summary: fabricSummary(),
    windows: state.windows.map(w=>{
      const p = productFor(w.style, w.layer);
      const fabs = windowFabrics(w);
      const fS = fabs.find(f=>f.layer==="sheer"), fB = fabs.find(f=>f.layer==="blackout");
      return {
        window_name: w.window_name, room: w.room || null,
        product_code: p.code,
        width_cm: +w.width_cm, height_cm: +w.height_cm, pooling_cm: +w.pooling_cm||0,
        fixing: w.fixing||null, opening: w.opening||null, track_color: w.track_color||null,
        fabric_code_sheer: fS? (fS.code||null) : null,
        fabric_code_blackout: fB? (fB.code||null) : null,
        sheer_roll_width_cm: fS? (fS.roll||null) : null,
        blackout_roll_width_cm: fB? (fB.roll||null) : null,
        sheer_fabric_m: fS? fS.meters : null,
        blackout_fabric_m: fB? fB.meters : null,
        addons: windowAddons(w).map(a=>({code:a.code, qty:a.qty})),
        notes: w.notes || null,
        // coverage geometry — server re-derives width/height from these
        coverage_type: w.coverage || "wall_to_wall",
        base_width_cm: w.base_width_cm===""? null : +w.base_width_cm,
        left_extra_cm: +w.left_extra_cm||0,
        right_extra_cm: +w.right_extra_cm||0,
        base_height_cm: w.base_height_cm===""? null : +w.base_height_cm,
        top_extra_cm: +w.top_extra_cm||0,
        height_left_cm: +w.height_left_cm||null,
        height_middle_cm: +w.height_middle_cm||null,
        height_right_cm: +w.height_right_cm||null,
        measured_by: w.measured_by||null,
        centre_overlap_cm: +w.centre_overlap_cm||0,
        photo_urls: w.photos||[],
        ceiling_material: w.ceiling_material||null,
        skirting_height_cm: +w.skirting_height_cm||null,
        pocket_depth_cm: +w.pocket_depth_cm||null,
        window_shape: w.window_shape||null,
        velcro_side: w.velcro_side||null,
        velcro_middle_pieces: +w.velcro_middle_pieces||0,
        tieback_finish: w.tieback_finish||null,
        tieback_side: w.tieback_side||null,
        motor_side: w.motor_side||null,
        socket_nearby: w.socket_nearby===null?null:!!w.socket_nearby,
        trunking_needed: w.trunking_needed===null?null:!!w.trunking_needed,
        existing_covering: w.existing_covering||null,
        existing_count: +w.existing_count||0,
        existing_action: w.existing_action||null,
        fullness_override: +w.fullness_override||null
      };
    })
  };
  try{
    const res = await api("/rest/v1/rpc/submit_order", {method:"POST", body: JSON.stringify({payload})});
    loading(false);
    showSuccess(res);
    localStorage.removeItem("pfc_draft_v1");
  }catch(e){
    loading(false);
    toast("Could not submit: "+e.message+" — your order is saved as draft, try again.", false);
  }
}

function showSuccess(res){
  $("#totbar").style.display="none";
  $("#stepdots").style.display="none"; $("#stepname").style.display="none";
  $("#main").innerHTML = `
  <div class="success">
    <div class="big">🎉</div>
    <div>Order confirmed</div>
    <div class="ono">${esc(res.order_no)}</div>
    <div class="amt">${fmt(res.total)} ${res.discount_pct>0?`<span class="disc">(${res.discount_pct}% discount applied)</span>`:""}</div>
    <div class="sub">Saved to the PFC database.<br>The team WhatsApp group is being notified automatically.</div>
    <button class="btn primary" onclick="newOrder()">＋ Start New Order</button>
  </div>`;
  window.scrollTo(0,0);
}

function newOrder(){
  const sp = state.salesperson;
  state = { step:1, customer_name:"", customer_phone:"", salesperson:sp, gps:null, location_url:"",
    installation_date:"", address:"", floor_number:"", lift_available:null,
    advance_amount:"", payment_mode:"", notes:"", windows:[] };
  $("#stepdots").style.display="flex"; $("#stepname").style.display="block";
  render(); window.scrollTo(0,0);
}

bootstrap();
</script>
</body>
</html>
