<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Handpicked Interiors — Sales</title>
<style>
  :root{
    --brand:#0f4c5c; --brand-dark:#0a3540; --accent:#e36414; --ok:#1a7f37;
    --bg:#f2f5f7; --card:#ffffff; --line:#dde4e8; --txt:#16232a; --muted:#5f7480;
    --danger:#c0392b; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
      "Noto Sans Devanagari","Noto Sans Bengali",Arial,sans-serif;font-size:16px;}
  /* Devanagari and Bengali need more vertical room than Latin */
  html[lang="hi"] body,html[lang="bn"] body{line-height:1.5;}
  html[lang="hi"] label.f,html[lang="bn"] label.f{line-height:1.45;}
  h1,h2,h3{margin:0;}
  .hidden{display:none !important;}

  /* Header */
  /* white header: the Handpicked Interiors logo is drawn for a light background */
  header{background:#fff;color:var(--txt);padding:10px 14px;position:sticky;top:0;z-index:50;
    display:flex;align-items:center;gap:12px;border-bottom:3px solid #b07150;}
  header .logo{height:36px;width:auto;display:block;flex:none;}
  header .t2{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.25;}
  /* language selector — first item in the header, top left */
  header .langsel{width:auto;flex:none;padding:7px 26px 7px 9px;font-size:14px;font-weight:700;
    border:1.5px solid var(--line);border-radius:10px;background-color:#fff;
    color:var(--txt);line-height:1.2;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%235f7480' d='M6 8 0 0h12z'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 9px center;background-size:9px;}
  header .langsel option{color:var(--txt);background:#fff;}
  header .langsel:focus{outline:none;border-color:var(--brand);}

  /* Steps */
  .steps{display:flex;gap:6px;padding:12px 16px 0;}
  .steps .dot{flex:1;height:6px;border-radius:3px;background:#cfd9de;}
  .steps .dot.on{background:var(--accent);}
  .stepname{padding:8px 16px 4px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;}

  main{padding:0 14px 140px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  label.f:first-child{margin-top:0;}
  label.f .req{color:var(--danger);}
  input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],select,textarea{
    width:100%;padding:14px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;
    background:#fff;color:var(--txt);appearance:none;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);}
  textarea{min-height:70px;resize:vertical;}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px;}

  .btn{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:18px;
    font-weight:700;cursor:pointer;text-align:center;}
  .btn.primary{background:var(--accent);color:#fff;}
  .btn.brand{background:var(--brand);color:#fff;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
  .btn.small{padding:11px;font-size:15px;width:auto;display:inline-block;}
  .btn:disabled{opacity:.5;}
  .btnrow{display:flex;gap:10px;}
  .btnrow .btn{flex:1;}

  /* chips / segmented */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:11px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;
    font-size:15px;font-weight:600;color:var(--txt);cursor:pointer;}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;}
  .seg button{flex:1;padding:13px 6px;border:none;background:#fff;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg button.on{background:var(--brand);color:#fff;}

  /* style cards */
  /* product grid: photos fill the card width (4:3). The grid collapses to one
     "picked" row once a product is chosen, so the big photos never push the size fields down. */
  .stylegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (min-width:600px){ .stylegrid{grid-template-columns:repeat(3,1fr);} }
  .stylecard{border:1.5px solid var(--line);border-radius:12px;padding:6px 6px 10px;text-align:center;
    background:#fff;cursor:pointer;}
  .stylecard.on{border-color:var(--accent);background:#fdf1e8;}
  .stylecard .im{width:100%;aspect-ratio:4/3;border-radius:8px;
    background-size:cover;background-position:center;background-color:#e8eef0;}
  .stylecard .ic{font-size:40px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;}
  .stylecard .nm{font-weight:700;font-size:15px;margin-top:7px;}
  .stylecard .pr{font-size:12px;color:var(--muted);margin-top:2px;}
  .picked{display:flex;align-items:center;gap:12px;}
  .picked .pim{width:96px;height:72px;border-radius:9px;background-size:cover;background-position:center;
    background-color:#e8eef0;flex:none;}
  .picked .ic{font-size:34px;width:96px;text-align:center;flex:none;}
  .picked .l{flex:1;min-width:0;}
  .picked .nm{font-weight:800;font-size:16px;}
  .picked .pr{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .picked .btn.small{padding:9px 12px;font-size:14px;}

  /* live price box under width / height */
  .quote{background:#fdf1e8;border:1.5px solid #f3c9a6;border-radius:12px;padding:12px 14px;margin-top:12px;}
  .quote .ql{font-size:13.5px;font-weight:700;color:#8a4b1c;}
  .quote .qv{font-size:26px;font-weight:900;color:var(--txt);margin:2px 0 4px;}
  .quote .qd{font-size:13px;color:var(--muted);line-height:1.5;}
  .quote .qs{font-size:12px;color:var(--muted);margin-top:4px;}
  .ro{padding:14px;border:1.5px dashed var(--line);border-radius:12px;font-size:17px;background:#f7f9fa;
    color:var(--brand-dark);font-weight:700;}
  /* tick box (scaffolding) */
  .tickrow{display:flex;gap:12px;align-items:center;padding:12px 2px 2px;cursor:pointer;}
  .tickrow .tick{width:28px;height:28px;border:2px solid var(--brand);border-radius:7px;display:flex;
    align-items:center;justify-content:center;font-weight:900;color:#fff;flex:none;font-size:17px;}
  .tickrow .tick.on{background:var(--brand);}
  .tickrow.auto{cursor:default;}
  .tickrow.auto .tick{background:var(--ok);border-color:var(--ok);}
  .tickrow .nm{display:block;font-size:15px;font-weight:600;}
  .tickrow .pr{display:block;font-size:12.5px;color:var(--muted);}
  /* fabric preferences 1-2-3 */
  .prefrow{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .prefrow .pn{width:28px;height:28px;border-radius:50%;background:#e8f0f3;color:var(--brand);font-weight:800;
    display:flex;align-items:center;justify-content:center;flex:none;}
  /* send quote to customer */
  .sendrow{display:flex;gap:8px;margin-top:10px;}
  .sendrow .btn{flex:1;min-width:0;padding:14px 4px;font-size:14.5px;text-decoration:none;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  a.btn{text-decoration:none;}
  .sendrow .btn.wa{flex:1.4;}
  .sendrow .btn.both{flex:.8;}
  .btn.wa{background:#1fa855;color:#fff;}
  .btn.em{background:var(--brand);color:#fff;}
  .btn.both{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
  .btn.off{opacity:.45;}
  .qready{margin-top:14px;font-weight:800;color:var(--ok);font-size:15px;}
  .paybox{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f4f7f8;font-size:14px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .paybox.paid{background:#eef7ef;color:var(--ok);font-weight:800;}
  .obtns .btnrow .btn{font-size:16px;padding:14px 8px;}

  /* window list */
  .wincard{border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;
    padding:14px;margin:10px 0;}
  .wincard .top{display:flex;justify-content:space-between;align-items:center;}
  .wincard .nm{font-weight:800;font-size:17px;}
  .wincard .pill{background:#e8f0f3;color:var(--brand);font-size:12.5px;font-weight:700;
    border-radius:999px;padding:4px 10px;}
  .wincard .det{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .wincard .price{font-size:17px;font-weight:800;color:var(--brand);margin-top:8px;}
  .wincard .acts{display:flex;gap:8px;margin-top:10px;}
  .wincard .acts button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:14.5px;font-weight:600;cursor:pointer;}
  .wincard .acts .del{color:var(--danger);border-color:#eecfca;}

  /* addon rows */
  .addon{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:8px;}
  .addon:last-child{border-bottom:none;}
  .addon .l{flex:1;}
  .addon .nm{font-size:15px;font-weight:600;}
  .addon .pr{font-size:12.5px;color:var(--muted);}
  .switch{width:52px;height:32px;border-radius:16px;background:#cfd9de;position:relative;flex:none;cursor:pointer;border:none;}
  .switch.on{background:var(--ok);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
    background:#fff;transition:left .15s;}
  .switch.on::after{left:23px;}
  .stepper{display:flex;align-items:center;gap:2px;flex:none;}
  .stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:20px;font-weight:700;color:var(--brand);cursor:pointer;}
  .stepper .qv{width:34px;text-align:center;font-weight:700;font-size:16px;}

  /* totals bar */
  .totbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));z-index:60;box-shadow:0 -3px 12px rgba(0,0,0,.07);}
  .totbar .row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);}
  .totbar .row.big{font-size:19px;font-weight:800;color:var(--txt);}
  .totbar .save{font-size:12.5px;color:var(--ok);font-weight:700;}
  .totbar .btn{margin-top:8px;}

  /* overlay */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;
    padding:0 14px 120px;}
  .overlay .obar{position:sticky;top:0;background:var(--bg);padding:14px 0 8px;z-index:5;
    display:flex;align-items:center;gap:10px;}
  .overlay .obar h2{font-size:18px;flex:1;}
  .overlay .obar .x{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);
    background:#fff;font-size:18px;cursor:pointer;}
  .obtns{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));z-index:110;}

  /* fabric picker */
  .fabbtn{width:100%;padding:14px;border:1.5px dashed var(--brand);border-radius:12px;background:#f4fafc;
    font-size:15.5px;font-weight:600;color:var(--brand);cursor:pointer;text-align:left;}
  .fabbtn.set{border-style:solid;background:#eef7ef;border-color:var(--ok);color:var(--txt);}
  .fablist{margin-top:8px;}
  .fabitem{padding:13px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;cursor:pointer;font-size:15.5px;}
  .fabitem .rw{color:var(--muted);font-size:13.5px;}
  .estbox{background:#eef4f6;border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--brand-dark);margin-top:8px;line-height:1.5;}

  /* review */
  .revline{display:flex;justify-content:space-between;padding:7px 0;font-size:15px;}
  .revline.mut{color:var(--muted);font-size:14px;}
  .revline.tot{font-size:20px;font-weight:800;border-top:2px solid var(--line);padding-top:12px;margin-top:6px;}
  .disc{color:var(--ok);font-weight:700;}
  .nudge{background:#fdf6ec;border:1px solid #f0dcbd;color:#8a6d3b;border-radius:10px;
    padding:10px 12px;font-size:13.5px;margin-top:8px;}

  /* success */
  .success{ text-align:center;padding:60px 20px;}
  .success .big{font-size:64px;}
  .success .ono{font-size:40px;font-weight:900;color:var(--brand);margin:10px 0;}
  .success .amt{font-size:20px;font-weight:700;}
  .success .sub{color:var(--muted);margin:14px 0 30px;line-height:1.6;}

  .toast{position:fixed;top:14px;left:14px;right:14px;background:var(--danger);color:#fff;
    padding:14px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .toast.ok{background:var(--ok);}
  .loading{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:300;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;color:var(--brand);}
  .spin{width:44px;height:44px;border:5px solid #cfe0e6;border-top-color:var(--brand);border-radius:50%;
    animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .gpsbox{display:flex;gap:10px;align-items:center;}
  .gpsbox .st{flex:1;font-size:14px;color:var(--muted);}
  .gpsbox .st.ok{color:var(--ok);font-weight:700;}

  /* two numeric inputs side by side */
  .two{display:flex;gap:10px;}
  .two > div{flex:1;min-width:0;}
  .two label.f{margin-top:10px;}
  /* total-width / total-height callout */
  .totbox{background:#eef7ef;border:1.5px solid var(--ok);border-radius:10px;padding:11px 12px;
    margin-top:10px;font-size:15px;font-weight:700;color:var(--brand-dark);text-align:center;}
  .totbox small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px;}
  /* collapsible optional sections */
  .acc{border:1.5px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:#fff;}
  .acc > .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 14px;
    font-weight:700;font-size:15px;cursor:pointer;color:var(--brand-dark);}
  .acc > .hd .ar{color:var(--muted);font-size:13px;font-weight:600;}
  .acc > .bd{padding:0 14px 14px;border-top:1px solid var(--line);}
  .acc.shut > .bd{display:none;}
  /* options that belong to the add-on directly above them */
  .acc .sub{margin:0 0 10px 12px;padding-left:12px;border-left:3px solid var(--line);}
  /* photos */
  .photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .photos .ph{position:relative;width:78px;height:78px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);}
  .photos .ph img{width:100%;height:100%;object-fit:cover;display:block;}
  .photos .ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border:none;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0;cursor:pointer;}
  .cambtn{width:100%;padding:14px;border:1.5px dashed var(--brand);border-radius:12px;background:#f4f9fb;
    font-size:15.5px;font-weight:600;color:var(--brand);cursor:pointer;}
</style>
</head>
<body>

<header>
  <select class="langsel" id="langsel" aria-label="Language">
    <option value="en">EN</option>
    <option value="hi">हिं</option>
    <option value="bn">বাং</option>
  </select>
  <img class="logo" id="hdr_logo" alt="Handpicked Interiors">
  <div class="t2" id="hdr_sub">Sales Order App</div>
</header>

<div class="steps" id="stepdots">
  <div class="dot on"></div><div class="dot"></div><div class="dot"></div>
</div>
<div class="stepname" id="stepname">Step 1 of 3 — Customer</div>

<main id="main"></main>

<div class="totbar" id="totbar" style="display:none">
  <div class="row"><span id="tb_l1">Subtotal</span><span id="tb_v1">AED 0</span></div>
  <div class="row" id="tb_discrow" style="display:none"><span class="save" id="tb_l2"></span><span class="save" id="tb_v2"></span></div>
  <div class="row big"><span>Total</span><span id="tb_tot">AED 0</span></div>
  <button class="btn primary" id="tb_btn">Continue</button>
</div>

<div id="overlay_root"></div>
<div class="loading" id="loading"><div class="spin"></div><div id="loadmsg">Loading…</div></div>

<script>
"use strict";
/* ================= CONFIG ================= */
const SB_URL = "https://tdnxoezdbwlpmxgvtgdw.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkbnhvZXpkYndscG14Z3Z0Z2R3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNzc1MjIsImV4cCI6MjEwMDk1MzUyMn0.8tIy33fg44Wy6-HUAnmSGQyvcLxwzu5H_o3IXte_WXs";
const DEFAULT_ROLL_CM = 280;         // used when fabric/roll width unknown
const SAFETY_M = 1;                  // always add 1 m of fabric
const FULLNESS = {wave:2.5, american:2.2, eyelet:2.2, ring:2.2, roman:1.0};
const STYLE_META = {
  american:{nm:"American Style", ic:"🪡", cat:"curtain"},
  wave:{nm:"Wave Style", ic:"🌊", cat:"curtain"},
  eyelet:{nm:"Eyelet", ic:"⭕", cat:"curtain"},
  ring:{nm:"Ring Style", ic:"➰", cat:"curtain"},
  roman:{nm:"Roman Blind", ic:"📜", cat:"curtain"},
  roller:{nm:"Roller Blind", ic:"🎞️", cat:"blind"},
  zebra:{nm:"Zebra Blind", ic:"🦓", cat:"blind"},
  aluminium:{nm:"Aluminium Blind", ic:"🪟", cat:"blind"},
  vertical:{nm:"Vertical Blind", ic:"📶", cat:"blind"},
  venetian:{nm:"Venetian Blind", ic:"🪟", cat:"blind"},
  wooden:{nm:"Wooden Blind", ic:"🪵", cat:"blind"}
};
// Product pictures, embedded so the app stays one self-contained file (~55 KB total).
// Photos: 300x225 WebP q82 from the originals in "Claude Curtains/". ring / aluminium /

async function api(path, opts={}) {
  const r = await fetch(SB_URL + path, {...opts, headers:{
    "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json",
    ...(opts.headers||{}) }});
  if(!r.ok){ let m = "Request failed ("+r.status+")";
    try{ const j = await r.json(); m = j.message || j.hint || j.error || m; }catch(e){}
    throw new Error(m); }
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}

/* ================= PHOTOS ================= */
// Shrink on-device before upload — a raw phone photo is ~4 MB and would stall the form on mobile data.
function downscaleImage(file){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const scale = Math.min(1, PHOTO_MAX_PX/Math.max(img.width, img.height));
      const cw = Math.max(1,Math.round(img.width*scale)), ch = Math.max(1,Math.round(img.height*scale));
      const c = document.createElement("canvas"); c.width=cw; c.height=ch;
      c.getContext("2d").drawImage(img,0,0,cw,ch);
      c.toBlob(b=> b ? resolve(b) : reject(new Error("could not process image")), "image/jpeg", 0.7);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("could not read image")); };
    img.src = url;
  });
}

async function uploadPhoto(file){
  const blob = await downscaleImage(file);
  const name = Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";
  const path = PHOTO_BUCKET+"/"+name;
  const r = await fetch(SB_URL+"/storage/v1/object/"+path, {
    method:"POST",
    headers:{"apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"image/jpeg"},
    body: blob });
  if(!r.ok){ let m="upload failed ("+r.status+")";
    try{ const j=await r.json(); m=j.message||j.error||m; }catch(e){}
    throw new Error(m); }
  return SB_URL+"/storage/v1/object/public/"+path;
}

/* ================= DATA LOAD ================= */
async function bootstrap(){
  loading(true, tr("load.catalog"));
  try{
    const [cat, sp] = await Promise.all([
      api("/rest/v1/product_catalog?select=code,name,category,style,layer_type,unit,price,tall_window_rule,uses_fabric,sort_order&is_active=eq.true&order=sort_order"),
      api("/rest/v1/salespersons?select=name&order=name")
    ]);
    CATALOG = cat; SALESPEOPLE = sp.map(x=>x.name);
    // fabrics: cached 24h in localStorage
    let fc = null;
    try{ fc = JSON.parse(localStorage.getItem("pfc_fabrics_v1")||"null"); }catch(e){}
    if(fc && Date.now()-fc.t < 24*3600*1000 && Array.isArray(fc.d) && fc.d.length){ FABRICS = fc.d; }
    else{
      loading(true, tr("load.fabrics"));
      const rows = [];
      for(let off=0;;off+=1000){                       // PostgREST caps at 1000 rows/request
        const page = await api("/rest/v1/fabrics?select=fabric_code,roll_width_cm&order=fabric_code",
          {headers:{"Range": off+"-"+(off+999)}});
        rows.push(...(page||[]));
        if(!page || page.length<1000) break;
      }
      FABRICS = rows.map(r=>({c:r.fabric_code, w:r.roll_width_cm?Number(r.roll_width_cm):null}));
      try{ localStorage.setItem("pfc_fabrics_v1", JSON.stringify({t:Date.now(), d:FABRICS})); }catch(e){}
    }
    // restore draft
    try{ const d = JSON.parse(localStorage.getItem("pfc_draft_v1")||"null");
      if(d && d.windows){ state = {...state, ...d, step: d.step||1};
        // drafts saved by an older build lack the coverage keys — migrate them in place
        state.windows = (state.windows||[]).map(w=>applyGeometry(normalizeWin(w))); } }catch(e){}
    const lastSp = localStorage.getItem("pfc_salesperson");
    if(lastSp && !state.salesperson) state.salesperson = lastSp;
  }catch(e){ toast(tr("t.load.fail",{m:e.message})); }
  loading(false);
  render();
}

function saveDraft(){ try{ localStorage.setItem("pfc_draft_v1", JSON.stringify(state)); }catch(e){} }

  const meta = STYLE_META[style]||{};
  if(meta.cat === "blind") return CATALOG.find(p=>p.category==="blind" && p.style===style);
  return CATALOG.find(p=>p.category==="curtain" && p.style===style && p.layer_type===layer);
}
function addonRow(code){ return CATALOG.find(p=>p.code===code); }
function availableStyles(){
  const seen = [], out=[];
  for(const p of CATALOG){ if(p.category==="addon") continue;
    if(!p.style || seen.includes(p.style)) continue; seen.push(p.style);
    out.push(p.style); }
  return out;
}
function layersForStyle(style){
  return CATALOG.filter(p=>p.category==="curtain" && p.style===style).map(p=>p.layer_type);
}

/* ================= CALCULATIONS ================= */
function rollWidthOf(code){ if(!code) return null;
  const f = FABRICS.find(x=>x.c===code); return f && f.w ? f.w : null; }

// Fabric needed for ONE layer of a window (metres). Mirrors production panel-plan logic:
// railroaded when roll width > fabric height + 22cm; else vertical panels of (height+22cm).
// +16cm sewing allowance on gathered width, +1m safety always added.
function fabricMeters(style, widthCm, heightCm, poolingCm, rollCm, fullnessOverride){
  if(!widthCm || !heightCm) return 0;
  const mult = (+fullnessOverride > 0) ? +fullnessOverride : (FULLNESS[style] ?? 2.2);
  const roll = rollCm || DEFAULT_ROLL_CM;
  const hFab = Math.max(heightCm + (poolingCm||0), 30);
  const gatheredW = widthCm * mult;
  let m;
  if(roll > hFab + 22){ m = (gatheredW + 16)/100; }
  else{ const panels = Math.ceil((gatheredW + 16)/roll); m = panels * (hFab + 22)/100; }
  return Math.ceil((m + SAFETY_M)*10)/10;   // round UP to 0.1 m
}

function windowFabrics(w){
  // returns [{layer:'sheer'|'blackout', code, roll, meters}]
  const p = productFor(w.style, w.layer); if(!p || !p.uses_fabric) return [];
  const out = [];
  const need = (w.style==="roman") ? [w.layer] :
    (w.layer==="sheer_blackout" ? ["sheer","blackout"] : [w.layer]);
  for(const lay of need){
    const code = lay==="sheer" ? w.fabric_sheer : w.fabric_blackout;
    const roll = rollWidthOf(code);
    out.push({layer:lay, code:code||null, roll:roll,
      meters: fabricMeters(w.style, +w.width_cm, +w.height_cm, +w.pooling_cm||0, roll, w.fullness_override)});
  }
  return out;
}

function priceProduct(p, widthCm, heightCm){
  const billW = Math.max(widthCm,100)/100;
  let rate = +p.price;
  if(p.tall_window_rule && heightCm > 300) rate = rate * (heightCm/100)/3;
  if(p.unit==="per_m_width") return r2(rate*billW);
  if(p.unit==="per_sqm") return r2(rate*billW*(heightCm/100));
  if(p.unit==="fixed") return r2(rate);
  return r2(rate);
}

// Mirrors the server's price_window() — per_m_width / per_sqm add-ons are multiplied by qty
// (only the motorised track uses qty > 1 there: one per layer).
function windowAddons(w){
  // returns [{code,name,qty,amount}]
  const out=[]; const width=+w.width_cm||0, height=+w.height_cm||0;
  const billW=Math.max(width,100)/100;
  const push=(code,qty)=>{ const p=addonRow(code); if(!p || !(qty>0)) return;
    let amt;
    if(p.unit==="per_m_width") amt = r2(+p.price*billW*qty);
    else if(p.unit==="per_sqm") amt = r2(+p.price*billW*(height/100)*qty);
    else if(p.unit==="fixed") amt = r2(+p.price);
    else amt = r2(+p.price*qty);
    out.push({code, name:p.name, qty, amount:amt}); };
  const a = w.addons||{};
  if(a.pelmet) push("ADD-PELC",1);
  if(a.boxblind) push("ADD-BOXB",1);
  const mc = motorCode(w.motor_type);
  if(mc){ const n = motorCount(w); push(mc, n); if(isTrackCurtain(w)) push("ADD-MTRK", n); }
  if(a.stick>0) push("ADD-STK", a.stick);
  if(a.returns>0) push("ADD-RET", a.returns);
  if(a.bend>0) push("ADD-BND", a.bend);
  if(a.velcro) push("ADD-VEL",1);
  // tie belt is its own choice, not an add-on count
  if(w.tie_belt==="velcro") push("ADD-TIEV",1);
  else if(w.tie_belt==="hooks") push("ADD-TIE",1);
  if(a.removal) push("ADD-REM",1);
  if(a.alteration>0) push("ADD-ALT", a.alteration);
  if(needsScaffold(w)) push("ADD-SCAF",1);
  return out;
}

function windowPrice(w){
  const p = productFor(w.style, w.layer);
  if(!p || !w.width_cm || !w.height_cm) return {base:0, addons:0, total:0, list:[]};
  const base = priceProduct(p, +w.width_cm, +w.height_cm);
  const list = windowAddons(w);
  const addons = r2(list.reduce((s,x)=>s+x.amount,0));
  return {base, addons, total:r2(base+addons), list};
}

// Human-readable summary of how the total width was reached, so it can be checked at a glance.
function coverageNote(w){
  const bits = [];
  if(w.coverage==="window_width"){
    const lx=+w.left_extra_cm||0, rx=+w.right_extra_cm||0;
    bits.push(lx||rx ? tr("cn.win",{b:+w.base_width_cm||0, l:lx, r:rx, n:w.width_cm})
                     : tr("cn.win0",{n:w.width_cm}));
  } else if(w.coverage==="inside_frame"){ bits.push(tr("cov.in")); }
  else { bits.push(tr("cov.w2w")); }
  if(w.fixing==="Wall" && +w.top_extra_cm>0) bits.push(tr("cn.top",{n:+w.top_extra_cm}));
  if(w.uneven){
    const hs=[w.height_left_cm,w.height_middle_cm,w.height_right_cm].map(x=>+x).filter(x=>x>0);
    if(hs.length>1) bits.push(tr("cn.uneven",{h:hs.join("/"), n:Math.min(...hs)}));
  }
  if(w.measured_by==="customer") bits.push(tr("cn.custsize"));
  if(+w.fullness_override>0) bits.push(tr("cn.gather",{n:+w.fullness_override}));
  return bits.join(" · ");
}

// Fabric name + the customer's preferences 1-2-3, escaped (free text).
// keeps the salesperson's numbering: a blank preference 2 still leaves "3) …" as 3
function fabricPrefs(w){
  return [w.fabric_pref_1, w.fabric_pref_2, w.fabric_pref_3]
    .map((x,i)=>({n:i+1, v:String(x||"").trim()})).filter(p=>p.v);
}
function fabricNote(w){
  const bits = [], nm = String(w.fabric_name||"").trim(), prefs = fabricPrefs(w);
  if(nm) bits.push(tr("cn.fab",{n:esc(nm)}));
  if(prefs.length) bits.push(tr("cn.prefs",{n:prefs.map(p=>p.n+") "+esc(p.v)).join("  ")}));
  return bits.join(" · ");
}

// "from AED x" under each product photo
function fromText(s){
  const rows = CATALOG.filter(x=>x.style===s && x.category!=="addon");
  if(!rows.length) return "";
  const min = Math.min(...rows.map(x=>+x.price));
  return rows[0].unit==="per_sqm" ? tr("we.from.sqm",{p:min}) : tr("we.from.m",{p:min});
}
function productPic(s, cls){
  const img = STYLE_IMG[s];
  return img ? `<div class="${cls}" style="background-image:url('${img}')"></div>`
             : `<div class="ic">${(STYLE_META[s]||{}).ic||"🪟"}</div>`;
}

function orderTotals(){
  let sub = 0;
  for(const w of state.windows) sub += windowPrice(w).total;
  sub = r2(sub);
  let pct = 0; if(sub>3000) pct=10; else if(sub>1500) pct=5;
  const disc = r2(sub*pct/100);
  return {sub, pct, disc, total:r2(sub-disc)};
}

function fabricSummary(){
  const agg = {};
  for(const w of state.windows){ for(const f of windowFabrics(w)){
    const key = f.code || "— fabric to be selected —";
    if(!agg[key]) agg[key] = 0; agg[key] = Math.round((agg[key]+f.meters)*10)/10; } }
  return Object.entries(agg).map(([code, m])=>({code, meters:m}));
}

/* ================= RENDER: STEPS ================= */
function render(){
  if(state.step!==3) stopPayPoll();
  const dots = $("#stepdots").children;
  for(let i=0;i<3;i++) dots[i].classList.toggle("on", i < state.step);
  $("#stepname").textContent = tr("step."+state.step);
  if(state.step===1) renderStep1();
  if(state.step===2) renderStep2();
  if(state.step===3) renderStep3();
  saveDraft();
}

function totbar(show, btnLabel, handler){
  const tb = $("#totbar");

  tb.style.display="block";
  $("#tb_v1").textContent = fmt(t.sub);
  const dr = $("#tb_discrow");
  if(t.pct>0){ dr.style.display="flex"; $("#tb_l2").textContent = tr("tb.disc",{p:t.pct});
    $("#tb_v2").textContent = "− "+fmt(t.disc); } else dr.style.display="none";
  $("#tb_tot").textContent = fmt(t.total);
  const b = $("#tb_btn"); b.textContent = btnLabel; b.onclick = handler;
}

/* ---------- window editor overlay ---------- */
function blankWin(){
  return { window_name:"W"+(state.windows.length+1), room:"", style:"", layer:"",
    width_cm:"", height_cm:"", pooling_cm:0, fixing:"", opening:"", track_color:"",
    fabric_sheer:"", fabric_blackout:"", addons:{stick:0,returns:0,bend:0,alteration:0}, notes:"",
    tie_belt:"",                       // "" | "velcro" | "hooks"
    // coverage geometry — width_cm/height_cm are always the DERIVED totals
    coverage:"wall_to_wall", base_width_cm:"", left_extra_cm:0, right_extra_cm:0,
    base_height_cm:"", top_extra_cm:0,
    uneven:false, height_left_cm:"", height_middle_cm:"", height_right_cm:"",
    measured_by:"", centre_overlap_cm:0, photos:[],
    // quote extras (19 Nov 2026)
    scaffolding:false, motor_type:"",
    fabric_name:"", fabric_pref_1:"", fabric_pref_2:"", fabric_pref_3:"",
    // site details (optional)
    ceiling_material:"", skirting_height_cm:"", pocket_depth_cm:"", window_shape:"",
    // finishing details (optional)
    velcro_side:"", velcro_middle_pieces:0, tieback_finish:"", tieback_side:"",
    motor_side:"", socket_nearby:null, trunking_needed:null,
    existing_covering:"", existing_count:0, existing_action:"", fullness_override:"" };
}

// Fill in keys missing from older drafts / older saved windows, so arithmetic never sees undefined.
function normalizeWin(w){
  const d = blankWin();
  for(const k in d){ if(w[k]===undefined) w[k] = d[k]; }
  w.addons = w.addons || {};
  if(!Array.isArray(w.photos)) w.photos = [];
  // tie belt used to be an add-on count; carry an older draft over to the new choice
  if(!w.tie_belt && +w.addons.tie > 0) w.tie_belt = "hooks";
  delete w.addons.tie;
  // 19 Nov 2026: track colour + centre overlap removed; motor became a 4-way choice
  w.track_color = ""; w.centre_overlap_cm = 0;
  if(w.addons.motor && !w.motor_type) w.motor_type = "Dooya Electrical";
  delete w.addons.motor;
  if(w.opening==="Middle (2-way)") w.opening = "2 way";
  else if(w.opening==="One side (1-way)") w.opening = "1 way";
  // pre-coverage windows stored only width_cm/height_cm — treat those as the base measurement
  if(w.base_width_cm==="" && w.width_cm!=="") w.base_width_cm = w.width_cm;
  if(w.base_height_cm==="" && w.height_cm!=="") w.base_height_cm = w.height_cm;
  return w;
}

// Single source of truth for the derived totals. Call before pricing or rendering.
function applyGeometry(w){
  const lx = w.coverage==="window_width" ? (+w.left_extra_cm||0) : 0;
  const rx = w.coverage==="window_width" ? (+w.right_extra_cm||0) : 0;
  const tx = w.fixing==="Wall" ? (+w.top_extra_cm||0) : 0;
  w.width_cm  = w.base_width_cm==="" || w.base_width_cm==null ? "" : r2((+w.base_width_cm||0) + lx + rx);
  w.height_cm = w.base_height_cm==="" || w.base_height_cm==null ? "" : r2((+w.base_height_cm||0) + tx);
  return w;
}
// uneven heights drive the base height: use the SMALLEST so the curtain never drags
function syncUneven(w){
  if(!w.uneven) return;
  const hs = [w.height_left_cm, w.height_middle_cm, w.height_right_cm].map(x=>+x).filter(x=>x>0);
  if(hs.length) w.base_height_cm = Math.min(...hs);
}

function openWinEditor(idx, preset){
  editIdx = idx;
  editWin = idx>=0 ? JSON.parse(JSON.stringify(state.windows[idx])) : blankWin();
  if(idx<0 && preset && preset.style){ editWin.style = preset.style; editWin.layer = preset.layer||""; }
  normalizeWin(editWin); applyGeometry(editWin);
  // A new window is a quick quote: product + width + height only. Editing a saved window
  // is when the measurements, fitting and fabric get filled in, so open those sections.
  const full = idx>=0;
  accOpen = {details:full, fabric:full, addons:false, site:false, finish:false};
  pickOpen = !editWin.style;
  drawWinEditor();
}

function totHHtml(w){
  if(w.fixing!=="Wall" || w.base_height_cm==="" || !(+w.top_extra_cm>0)) return "";
  return `<div class="totbox">${tr("we.totalh",{n:w.height_cm})}
    <small>${tr("we.totalh.sub",{b:+w.base_height_cm, t:+w.top_extra_cm})}</small></div>`;
}
function unevenHtml(w){
  if(!w.uneven) return "";
  const hs = [w.height_left_cm, w.height_middle_cm, w.height_right_cm].map(x=>+x).filter(x=>x>0);
  return hs.length>1
    ? `<div class="totbox">${tr("we.hused",{n:Math.min(...hs)})}<small>${tr("we.hused.sub",{d:r2(Math.max(...hs)-Math.min(...hs))})}</small></div>`
    : `<div class="hint">${tr("we.uneven.hint")}</div>`;
}
function fabEstHtml(w){
  const fabs = windowFabrics(w);
  if(!fabs.length || !w.width_cm || !w.height_cm) return "";
  return `<div class="estbox">${tr("we.fab.need")}<br>` +
    fabs.map(f=>`${tr(f.layer==="sheer"?"sheer":"blackout")}: <b>${f.meters} m</b> ${f.code
      ? "("+esc(f.code)+", "+tr("we.fab.roll2",{n:(f.roll||DEFAULT_ROLL_CM)})+(f.roll?"":tr("we.fab.assumed"))+")"
      : tr("we.fab.none",{n:DEFAULT_ROLL_CM})}`).join("<br>") + `</div>`;
}
function motorHintHtml(w){
  const mc = motorCode(w.motor_type); if(!mc) return "";
  const n = motorCount(w), bits = [];
  if(n>1) bits.push(tr("we.motor.two"));
  const trk = addonRow("ADD-MTRK");
  if(isTrackCurtain(w) && trk) bits.push(tr("we.motor.track",{r:+trk.price, m:Math.max(+w.width_cm||0,100)/100}));
  const amt = windowAddons(w).filter(a=>a.code===mc || a.code==="ADD-MTRK").reduce((s,a)=>s+a.amount,0);
  bits.push(tr("we.motor.total",{amt:fmt0(amt)}));
  return `<div class="hint" style="margin:0 0 10px">${bits.join("<br>")}</div>`;
}

    return `<div class="stylecard ${w.style===s?"on":""}" data-s="${s}">
      ${productPic(s,"im")}
      <div class="nm">${esc(sm.nm||s)}</div>
      <div class="pr">${fromText(s)}</div></div>`;

  const picked = w.style ? `<div class="picked">${productPic(w.style,"pim")}

        </div>
        ${w.fixing==="Wall"?`
        <label class="f">${tr("we.tx")}</label>
        <input type="number" id="w_tx" inputmode="decimal" placeholder="0" value="${+w.top_extra_cm||""}">

        ${!isBlind && w.style ? `

    ${w.style?`

    <div class="acc ${accOpen.addons?"":"shut"}" id="acc_addons">
      ${accHd("addons","acc.addons",price.list.length,"acc.added")}

          return `<div class="chip ${w.motor_type===m.v?"on":""}" data-set="motor_type|${esc(m.v)}">${esc(m.v)} · ${fmt0(r.price)}</div>`; }).join("")}</div>

  // The overlay is the scroll container and we replace it wholesale on every tap,

  const prevOv = $("#winov");
  const keepScroll = prevOv ? prevOv.scrollTop : 0;
  $("#overlay_root").innerHTML = html;
  const newOv = $("#winov");
  if(newOv && keepScroll) newOv.scrollTop = keepScroll;
  document.body.style.overflow = "hidden";

  // Every input in this overlay MUST be read here — the editor re-renders on any tap,
  // so an unread field would be wiped the moment the user touches a chip or switch.
  const val = (id, field)=>{ const e = $("#"+id); if(e) w[field] = e.value; };
  const grab = ()=>{
    w.window_name = $("#w_name").value.trim() || w.window_name;
    val("w_bw","base_width_cm"); val("w_lx","left_extra_cm"); val("w_rx","right_extra_cm");

    val("w_pref1","fabric_pref_1"); val("w_pref2","fabric_pref_2"); val("w_pref3","fabric_pref_3");
    const pc = $("#w_poolcm"); if(pc){
      const sign = +w.pooling_cm<0 ? -1 : (+w.pooling_cm>0 ? 1 : 0);

  $("#winov").querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{ grab();

  $("#winov").querySelectorAll("[data-sm]").forEach(b=>b.onclick=()=>{ grab();

  const wm = $("#w_meas"); if(wm) wm.querySelectorAll("button").forEach(b=>b.onclick=()=>{

  $("#winov").querySelectorAll("[data-uv]").forEach(b=>b.onclick=()=>{

function openFabricPicker(layer){

function orderPayload(){

/* --- customer quote: WhatsApp / email / Stripe --- */
// What the price depends on. A quote whose signature differs from the cart is out of date.
function quoteSig(){
  return JSON.stringify(state.windows.map(w=>{ const p = productFor(w.style,w.layer);
    return [p&&p.code, w.width_cm, w.height_cm, windowAddons(w).map(a=>a.code+"*"+a.qty)]; }));
}
// UAE numbers as typed (05x…, 5x…, +971…, 00971…) -> 9715xxxxxxxx for wa.me
function waNumber(s){
  let d = String(s||"").replace(/\D/g,"");
  if(d.startsWith("00")) d = d.slice(2);
  if(d.length===10 && d.startsWith("05")) d = "971"+d.slice(1);
  else if(d.length===9 && d.startsWith("5")) d = "971"+d;
  return d.length>=10 ? d : "";
}
const validEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(s||"").trim());
function payAmount(){
  const tot = state.quote && state.quote.sig===quoteSig() ? state.quote.total : orderTotals().total;
  if(state.pay_mode==="half") return r2(tot/2);
  if(state.pay_mode==="custom") return r2(+state.pay_custom||0);
  return tot;
}
function quoteCurrent(){
  const q = state.quote;
  if(!q || q.sig!==quoteSig()) return false;
  if(q.status==="paid" || !state.want_pay || STRIPE_ON===false || q.nostripe) return true;
  return !!q.url && q.status!=="expired" && Math.abs((+q.pay_amount||0) - payAmount()) < 0.005;
}

// Customer-facing text — always English, whatever language the salesperson's screen is in.
function quoteText(q, forEmail){
  const B = s => forEmail ? s : "*"+s+"*";
  const n = v => +v;
  const L = [];
  L.push(B("Handpicked Interiors — Quotation "+q.no));
  L.push(new Date().toLocaleDateString("en-AE",{day:"2-digit",month:"short",year:"numeric"}) + " · " + state.customer_name);
  L.push("");
  (q.lines||[]).forEach((l,i)=>{
    L.push(`${i+1}) ${l.window_name}${l.room?" · "+l.room:""} — ${l.product_name}`);
    L.push(`   ${n(l.width_cm)} × ${n(l.height_cm)} cm: ${fmt(l.base_price)}`);
    (l.addons||[]).filter(a=>n(a.amount)>0).forEach(a=>
      L.push(`   + ${a.name}${n(a.qty)>1?" ×"+n(a.qty):""}: ${fmt(a.amount)}`));
    if(l.fabric_name) L.push(`   Fabric: ${l.fabric_name}`);
    if(l.fabric_prefs && l.fabric_prefs.length) L.push(`   Fabric options: ${l.fabric_prefs.join(" / ")}`);
    L.push(`   = ${fmt(l.line_total)}`);
  });
  L.push("");
  L.push("Subtotal: "+fmt(q.subtotal));
  if(n(q.discount_pct)>0) L.push(`Discount ${n(q.discount_pct)}%: − ${fmt(q.discount_amount)}`);
  L.push(B("Total: "+fmt(q.total)));
  if(q.url && q.status!=="paid"){
    const adv = n(q.pay_amount) < n(q.total) - 0.005;
    L.push("");
    L.push(`💳 Pay ${fmt(q.pay_amount)}${adv?" advance":""} securely by card:`);
    L.push(q.url);
    if(q.expires_at) L.push("(link valid until " + new Date(q.expires_at).toLocaleString("en-AE",
      {day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Dubai"}) + ")");
  }
  L.push("");
  L.push("Your consultant: "+state.salesperson);
  return L.join(forEmail ? "\r\n" : "\n");
}
const waHref = q => "https://wa.me/"+waNumber(state.customer_whatsapp)+"?text="+encodeURIComponent(quoteText(q,false));
const mailHref = q => "mailto:"+encodeURIComponent(String(state.customer_email||"").trim())+
  "?subject="+encodeURIComponent("Quotation "+q.no+" — Handpicked Interiors")+"&body="+encodeURIComponent(quoteText(q,true));

async function checkStripe(){
  if(STRIPE_ON!==null) return;
  try{ const r = await api("/functions/v1/quote-pay",{method:"POST", body:JSON.stringify({action:"config"})});
       STRIPE_ON = !!(r && r.stripe); }
  catch(e){ STRIPE_ON = false; }
  if(state.step===3) renderStep3();
}

function applyPayStatus(r){
  const q = state.quote; if(!q || !r || r.quote_id!==q.id) return;
  const was = q.status;
  q.status = r.payment_status; q.paid_amount = r.paid_amount;
  if(r.pay_url) q.url = r.pay_url;
  if(r.pay_amount!=null) q.pay_amount = r.pay_amount;
  if(r.expires_at) q.expires_at = r.expires_at;
  if(q.status==="paid" && was!=="paid"){
    // card money taken on the spot becomes the order's advance
    state.advance_amount = String(q.paid_amount);
    state.payment_mode = "Online";
    toast(tr("t.paid",{amt:fmt(q.paid_amount)}), true);
  }
}
function stopPayPoll(){ if(payPoll){ clearInterval(payPoll); payPoll = null; } }
function startPayPoll(){
  stopPayPoll();
  const q = state.quote;
  if(!q || !q.url || q.status!=="unpaid") return;
  const until = Date.now() + 20*60*1000;           // watch for 20 minutes after sending
  payPoll = setInterval(async ()=>{
    if(state.step!==3 || !state.quote || state.quote.status!=="unpaid" || Date.now()>until){ stopPayPoll(); return; }
    if(document.hidden) return;
    await refreshPay(false);
  }, 8000);
}
async function refreshPay(manual){
  const q = state.quote; if(!q) return;
  try{
    const r = await api("/functions/v1/quote-pay",{method:"POST", body:JSON.stringify({quote_id:q.id, action:"status"})});
    const before = q.status;
    applyPayStatus(r);
    if(manual || q.status!==before){ grabStep3(); saveDraft(); renderStep3(); }
    if(q.status!=="unpaid") stopPayPoll();
  }catch(e){ if(manual) toast(e.message); }
}

async function prepareQuote(){
  grabStep3();
  if(!waNumber(state.customer_whatsapp) && !validEmail(state.customer_email)){ toast(tr("t.need.wa")); return; }
  const wantLink = state.want_pay && STRIPE_ON!==false;
  loading(true, tr("load.quote"));
  try{
    let q = state.quote;
    const sig = quoteSig();
    if(!q || q.sig!==sig || q.status==="expired"){
      const payload = {...orderPayload(), replaces_quote_id: q ? q.id : null};
      const r = await api("/rest/v1/rpc/create_quote",{method:"POST", body:JSON.stringify({payload})});
      q = state.quote = { id:r.quote_id, no:r.quote_no, sig, lines:r.lines,
        subtotal:+r.subtotal, discount_pct:+r.discount_pct, discount_amount:+r.discount_amount, total:+r.total,
        url:null, pay_amount:null, expires_at:null, status:"unpaid", paid_amount:null, nostripe:false };
      sendStage = "";
    }
    if(wantLink && q.status!=="paid"){
      const amount = Math.min(payAmount(), q.total);
      if(!(amount>=2)){ toast(tr("t.payamt")); }
      else{
        const r = await api("/functions/v1/quote-pay",{method:"POST", body:JSON.stringify({quote_id:q.id, amount})});
        if(r && r.ok){ q.nostripe = false; applyPayStatus(r); }
        else if(r && r.reason==="stripe_not_configured"){ q.nostripe = true; STRIPE_ON = false; toast(tr("t.nostripe")); }
        else if(r && r.reason==="previous_quote_paid"){ toast(tr("t.prevpaid",{q:r.prev_quote_no, amt:fmt(r.paid_amount)})); }
        else toast(tr("t.quote.fail",{m:(r&&(r.message||r.reason))||"?"}));
      }
    }
  }catch(e){ toast(tr("t.quote.fail",{m:e.message})); }
  loading(false); saveDraft(); renderStep3(); startPayPoll();
}

// Read every step-3 input into state before any re-render (a re-render rebuilds them).

      <div class="seg" id="f_paymode">
        <button data-pm="full" class="${state.pay_mode==="full"?"on":""}">${tr("s3.full",{amt:fmt0(tot)})}</button>
        <button data-pm="half" class="${state.pay_mode==="half"?"on":""}">${tr("s3.half")}</button>
      </div>
      <input type="number" id="f_payamt" inputmode="decimal" style="margin-top:8px" value="${payAmount()}">`;
    }
  }

  if(q && q.sig!==quoteSig()) h += `<div class="nudge">${tr("s3.stale",{q:esc(q.no)})}</div>`;
  if(q && q.status==="expired" && q.sig===quoteSig()) h += `<div class="nudge">${tr("s3.payexp")}</div>`;

  if(!cur){
    const sameQuote = q && q.sig===quoteSig() && q.status!=="expired";
    const lbl = sameQuote ? tr("s3.prep.link") : (state.want_pay && !stripeKnownOff ? tr("s3.prep.pay") : tr("s3.prep"));
    h += `<button class="btn brand" id="f_mkquote" style="margin-top:14px">${lbl}</button>`;
  } else {
    const hasWa = !!waNumber(state.customer_whatsapp), hasEm = validEmail(state.customer_email);
    h += `<div class="qready">${tr("s3.ready",{q:esc(q.no), t:fmt(q.total)})}</div>
      <div class="hint">${tr("s3.sendvia")}</div>
      <div class="sendrow">
        <a class="btn wa ${hasWa?"":"off"}" id="f_sendwa" ${hasWa?`href="${esc(waHref(q))}" target="_blank" rel="noopener"`:""}>💬 WhatsApp</a>
        <a class="btn em ${hasEm?"":"off"}" id="f_sendem" ${hasEm?`href="${esc(mailHref(q))}"`:""}>📧 Email</a>
        <a class="btn both ${hasWa&&hasEm?"":"off"}" id="f_sendboth" ${hasWa&&hasEm?`href="${esc(waHref(q))}" target="_blank" rel="noopener"`:""}>${tr("s3.both")}</a>
      </div>
      ${sendStage==="email_next" && hasEm ? `<a class="btn em" id="f_sendem2" style="margin-top:8px" href="${esc(mailHref(q))}">${tr("s3.nowemail")}</a>`:""}`;
    if(q.status==="paid"){
      h += `<div class="paybox paid">${tr("s3.paid",{amt:fmt(q.paid_amount)})}</div>`;
    } else if(q.url){
      h += `<div class="paybox"><span>${tr("s3.paywait",{amt:fmt(q.pay_amount)})}</span>
        <button class="btn ghost small" id="f_paycheck">${tr("s3.paycheck")}</button></div>`;
    }
  }
  return h + `</div>`;
}

function renderStep3(){
  const m = $("#main");
  const t = orderTotals();
  const fs = fabricSummary();
  let winHtml = state.windows.map((w,i)=>{
    const p = windowPrice(w);
    const meta = STYLE_META[w.style]||{nm:w.style};
    const fn = fabricNote(w);
    return `<div class="revline"><span>${esc(w.window_name||("W"+(i+1)))} — ${esc(meta.nm)} ${esc(layerName(w.layer))} (${w.width_cm}×${w.height_cm})</span>
      <span><b>${fmt(p.total)}</b></span></div>` +
      (coverageNote(w)?`<div class="revline mut"><span>&nbsp;&nbsp;${coverageNote(w)}</span><span></span></div>`:"") +
      (fn?`<div class="revline mut"><span>&nbsp;&nbsp;🎨 ${fn}</span><span></span></div>`:"") +
      p.list.map(a=>`<div class="revline mut"><span>&nbsp;&nbsp;• ${esc(a.name)}${a.qty>1?" ×"+a.qty:""}</span><span>${fmt(a.amount)}</span></div>`).join("");
  }).join("");

  let nudge = "";
  if(t.pct===0 && t.sub>0 && t.sub<=1500) nudge = `<div class="nudge">${tr("s3.nudge",{amt:fmt(1500.01-t.sub), p:5})}</div>`;
  if(t.pct===5 && t.sub<=3000) nudge = `<div class="nudge">${tr("s3.nudge",{amt:fmt(3000.01-t.sub), p:10})}</div>`;

  // first visit: offer the customer phone from step 1 as the WhatsApp number
  if(!state.customer_whatsapp && state.customer_phone) state.customer_whatsapp = state.customer_phone;

  m.innerHTML = `
  <div class="card">
    <h3 style="margin-bottom:8px">👤 ${esc(state.customer_name)}</h3>
    <div class="revline mut"><span>${tr("s3.phone")}</span><span>${esc(state.customer_phone||"—")}</span></div>
    <div class="revline mut"><span>${tr("s3.sales")}</span><span>${esc(state.salesperson)}</span></div>
    <div class="revline mut"><span>${tr("s3.date")}</span><span>${new Date().toLocaleDateString("en-AE",{day:"2-digit",month:"short",year:"numeric"})} ${tr("s3.auto")}</span></div>
    <div class="revline mut"><span>${tr("s3.inst")}</span><span>${esc(state.installation_date||"—")}</span></div>
    <div class="revline mut"><span>${tr("s3.loc")}</span><span>${state.gps?tr("s3.gps"):"—"}</span></div>
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px">${tr("s3.windows",{n:state.windows.length})}</h3>
    ${winHtml}
    <div class="revline" style="border-top:1px solid var(--line);margin-top:6px;padding-top:10px"><span>${tr("tb.subtotal")}</span><span>${fmt(t.sub)}</span></div>
    ${t.pct?`<div class="revline disc"><span>${tr("s3.disc",{p:t.pct})}</span><span>− ${fmt(t.disc)}</span></div>`:""}
    <div class="revline tot"><span>${tr("tb.total")}</span><span>${fmt(t.total)}</span></div>
    ${nudge}
  </div>

  ${sendCardHtml()}

  <div class="card">
    <h3 style="margin-bottom:8px">${tr("s3.fabric")}</h3>
    ${fs.length? fs.map(f=>`<div class="revline"><span>${esc(f.code)}</span><span><b>${f.meters} m</b></span></div>`).join("") : `<div class="revline mut"><span>${tr("s3.nofabric")}</span><span></span></div>`}
  </div>

  <div class="card">
    <label class="f">${tr("s3.adv")}</label>
    <input type="number" id="f_adv" inputmode="decimal" placeholder="0" value="${esc(state.advance_amount)}">
    <label class="f">${tr("s3.pay")}</label>
    <div class="chips" id="f_pay">${["Cash","Card","Bank Transfer","Cheque","Online"].map(pm=>`<div class="chip ${state.payment_mode===pm?"on":""}" data-p="${pm}">${tr("pay."+pm)}</div>`).join("")}</div>
    <label class="f">${tr("s3.notes")}</label>
    <textarea id="f_notes" placeholder="${tr("s3.notes.ph")}">${esc(state.notes)}</textarea>
  </div>
  <button class="btn ghost" id="s3back">${tr("s3.back")}</button>`;

  $("#f_pay").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    grabStep3(); state.payment_mode = state.payment_mode===c.dataset.p ? "" : c.dataset.p; renderStep3(); });
  $("#s3back").onclick = ()=>{ grabStep3(); state.step=2; render(); };

  // --- send-quote card ---
  const rerender = ()=>{ grabStep3(); saveDraft(); renderStep3(); };
  const wp = $("#f_wantpay"); if(wp) wp.onclick = ()=>{ grabStep3(); state.want_pay = !state.want_pay; rerender(); };
  const pmode = $("#f_paymode"); if(pmode) pmode.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    grabStep3(); state.pay_mode = b.dataset.pm; rerender(); });
  const pa = $("#f_payamt"); if(pa) pa.addEventListener("change", ()=>{ state.pay_mode = "custom"; state.pay_custom = pa.value; rerender(); });
  const mk = $("#f_mkquote"); if(mk) mk.onclick = prepareQuote;
  const pc = $("#f_paycheck"); if(pc) pc.onclick = ()=>refreshPay(true);
  // contact fields: keep the send links in step with what is typed, without a re-render
  const relink = ()=>{
    grabStep3(); saveDraft();
    const q = state.quote; if(!q || !quoteCurrent()) return;
    const hasWa = !!waNumber(state.customer_whatsapp), hasEm = validEmail(state.customer_email);
    const setA = (id, ok, href, blank)=>{ const a = $("#"+id); if(!a) return;
      a.classList.toggle("off", !ok);
      if(ok){ a.href = href; if(blank){ a.target="_blank"; a.rel="noopener"; } } else a.removeAttribute("href"); };
    setA("f_sendwa", hasWa, waHref(q), true);
    setA("f_sendem", hasEm, mailHref(q), false);
    setA("f_sendboth", hasWa && hasEm, waHref(q), true);
    setA("f_sendem2", hasEm, mailHref(q), false);
  };
  ["f_wa","f_email"].forEach(id=>{ const e = $("#"+id); if(e) e.addEventListener("input", relink); });
  const markSent = via => { const q = state.quote; if(!q) return;
    api("/rest/v1/rpc/quote_mark_sent",{method:"POST", body:JSON.stringify({p_quote_id:q.id, p_via:via})}).catch(()=>{}); };
  const sw = $("#f_sendwa"); if(sw) sw.onclick = e=>{
    if(sw.classList.contains("off")){ e.preventDefault(); toast(tr("t.need.wa")); return; }
    markSent("whatsapp"); };
  const se = $("#f_sendem"); if(se) se.onclick = e=>{
    if(se.classList.contains("off")){ e.preventDefault(); toast(tr("t.need.email")); return; }
    markSent("email"); };
  const sb2 = $("#f_sendem2"); if(sb2) sb2.onclick = ()=>{ markSent("email"); sendStage = ""; setTimeout(rerender, 400); };
  const sb = $("#f_sendboth"); if(sb) sb.onclick = e=>{
    if(sb.classList.contains("off")){ e.preventDefault();
      toast(!waNumber(state.customer_whatsapp) ? tr("t.need.wa") : tr("t.need.email")); return; }
    // WhatsApp opens in its own tab/app; when the salesperson comes back, the email button is waiting
    markSent("whatsapp"); sendStage = "email_next"; setTimeout(rerender, 400); };

  totbar(true, tr("s3.submit"), submitOrder);
  checkStripe();
  if(state.quote && state.quote.url && state.quote.status==="unpaid" && !payPoll) startPayPoll();
}

/* ---------- submit ---------- */
async function submitOrder(){
  grabStep3();
  const t = orderTotals();
  if(!confirm(tr("s3.confirm",{c:state.customer_name, t:fmt(t.total)}))) return;
  loading(true, tr("load.submit"));
  const payload = orderPayload();
  try{
    const res = await api("/rest/v1/rpc/submit_order", {method:"POST", body: JSON.stringify({payload})});
    loading(false);
    stopPayPoll();
    showSuccess(res);
    localStorage.removeItem("pfc_draft_v1");
  }catch(e){
    loading(false);
    toast(tr("t.submit.fail",{m:e.message}), false);
  }
}

function showSuccess(res){
  const q = state.quote;
  $("#totbar").style.display="none";
  $("#stepdots").style.display="none"; $("#stepname").style.display="none";
  $("#main").innerHTML = `
  <div class="success">
    <div class="big">🎉</div>
    <div>${tr("ok.title")}</div>
    <div class="ono">${esc(res.order_no)}</div>
    <div class="amt">${fmt(res.total)} ${res.discount_pct>0?`<span class="disc">${tr("ok.disc",{p:res.discount_pct})}</span>`:""}</div>
    ${q && q.status==="paid" ? `<div class="amt disc" style="margin-top:8px">${tr("ok.paid",{amt:fmt(q.paid_amount)})}</div>`:""}
    <div class="sub">${tr("ok.sub")}</div>
    <button class="btn primary" onclick="newOrder()">${tr("ok.new")}</button>
  </div>`;
  window.scrollTo(0,0);
}

function newOrder(){
  stopPayPoll(); sendStage = "";
  state = blankState(state.salesperson);
  $("#stepdots").style.display="flex"; $("#stepname").style.display="block";
  render(); window.scrollTo(0,0);
}

$("#langsel").onchange = e=>setLang(e.target.value);
paintChrome();
bootstrap();
</script>
</body>
</html>
